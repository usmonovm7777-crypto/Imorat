<!doctype html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#222}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform vec2 uRes;
uniform int uModel;
uniform float uV;          // variant
uniform vec3 uA, uB, uBg, uE;
uniform int uMA, uMB;
uniform vec4 uCam;         // target y, dist, pitch, yaw
uniform sampler2D uLabel;
uniform int uLabMode;
uniform vec4 uLabRect;
uniform vec3 uLabC;
uniform vec2 uJit;
uniform vec3 uCh;
uniform float uChR, uChM;
out vec4 outCol;

#define PI 3.14159265
float hash(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float noise(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
 return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*noise(p);p*=2.03;a*=.5;}return s;}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float sdBox(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.);}
float sdRBox(vec3 p,vec3 b,float r){return sdBox(p,b-r)-r;}
float sdCyl(vec3 p,float r,float h){vec2 d=abs(vec2(length(p.xz),p.y))-vec2(r,h);return min(max(d.x,d.y),0.)+length(max(d,0.));}
float sdRCyl(vec3 p,float r,float h,float rr){vec2 d=vec2(length(p.xz)-r+rr,abs(p.y)-h+rr);return min(max(d.x,d.y),0.)+length(max(d,0.))-rr;}
float sdTorus(vec3 p,vec2 t){vec2 q=vec2(length(p.xz)-t.x,p.y);return length(q)-t.y;}
float sdCap(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h)-r;}
float sdSph(vec3 p,float r){return length(p)-r;}
float sdEll(vec3 p,vec3 r){float k0=length(p/r);float k1=length(p/(r*r));return k0*(k0-1.)/k1;}
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
vec2 U(vec2 a,vec2 b){return a.x<b.x?a:b;}
// cylinders along x / z
float cylX(vec3 p,float r,float h){return sdCyl(p.yxz,r,h);}
float cylZ(vec3 p,float r,float h){return sdCyl(p.xzy,r,h);}
float rcylX(vec3 p,float r,float h,float rr){return sdRCyl(p.yxz,r,h,rr);}
float rcylZ(vec3 p,float r,float h,float rr){return sdRCyl(p.xzy,r,h,rr);}

vec2 model(vec3 p){
 vec2 r=vec2(1e5,0.);
 int M=uModel; float V=uV;
 if(M==0){ // bag
  vec3 q=p-vec3(0.,1.0,0.);
  float d=sdRBox(q,vec3(.7,.98,.22),.14);
  d=smin(d,sdEll(q-vec3(0.,-.05,0.),vec3(.64,.9,.33)),.12);
  d=min(d,sdRBox(p-vec3(0.,1.96,0.),vec3(.64,.05,.05),.03));
  r=vec2(d*.9,1.);
 } else if(M==1){ // bricks
  vec3 b=vec3(.62,.16,.3);
  float d=sdRBox(p-vec3(-.02,.16,-.33),b,.025);
  d=min(d,sdRBox(p-vec3(.04,.16,.31),b,.025));
  vec3 q=p-vec3(0.,.485,0.);q.xz=rot(1.45)*q.xz;d=min(d,sdRBox(q,b,.025));
  q=p-vec3(-.05,.81,.0);q.xz=rot(1.6)*q.xz;d=min(d,sdRBox(q,b,.025));
  r=vec2(d,1.);
 } else if(M==2){ // gas block
  float d=sdRBox(p-vec3(0.,.3,0.),vec3(.9,.3,.45),.02);
  vec3 q=p-vec3(.12,.9,-.04);q.xz=rot(.22)*q.xz;d=min(d,sdRBox(q,vec3(.9,.3,.45),.02));
  r=vec2(d,1.);
 } else if(M==3){ // sheets stack
  float d=1e5;
  for(int i=0;i<6;i++){float fi=float(i);vec3 q=p-vec3(sin(fi*2.1)*.05,.035+fi*.072,cos(fi*1.7)*.035);d=min(d,sdRBox(q,vec3(1.05,.032,.72),.008));}
  r=vec2(d,1.);
 } else if(M==4){ // steel channels
  float d=1e5;
  for(int i=0;i<5;i++){float row=i<3?0.:1.;float col=i<3?float(i)-1.:float(i-3)-.5;vec3 q=p-vec3(0.,.06+row*.12,col*.32);
   float c=sdBox(q,vec3(1.25,.055,.14));c=max(c,-sdBox(q-vec3(0.,.016,0.),vec3(1.4,.05,.125)));d=min(d,c);}
  r=vec2(d,1.);
 } else if(M==5){ // insulation pack
  float d=sdRBox(p-vec3(0.,.62,0.),vec3(.95,.6,.55),.24);
  d=smin(d,sdEll(p-vec3(0.,.62,0.),vec3(.9,.66,.6)),.1);
  r=vec2(d*.9,1.);
 } else if(M==6){ // foam boards
  float d=1e5;
  for(int i=0;i<4;i++){float fi=float(i);vec3 q=p-vec3(sin(fi*1.3)*.06,.1+fi*.205,cos(fi*2.)*.05);d=min(d,sdRBox(q,vec3(.95,.1,.6),.012));}
  r=vec2(d,1.);
 } else if(M==7){ // corrugated / metal tile
  float d=1e5;
  for(int i=0;i<3;i++){float fi=float(i);vec3 q=p-vec3(fi*.07,.07+fi*.1,fi*.06);
   float w=V>.5? .045*sin(q.x*11.)+.03*sin(q.z*7.) : .04*sin(q.x*16.);
   q.y-=w;d=min(d,sdBox(q,vec3(1.1,.011,.75))*.55);}
  r=vec2(d,1.);
 } else if(M==8){ // beams
  float d=1e5;
  for(int i=0;i<3;i++)d=min(d,sdRBox(p-vec3(0.,.1,-.43+float(i)*.43),vec3(1.25,.1,.205),.012));
  for(int i=0;i<2;i++)d=min(d,sdRBox(p-vec3(.1,.302,-.215+float(i)*.43),vec3(1.25,.1,.205),.012));
  r=vec2(d,1.);
 } else if(M==9){ // rebar bundle
  float d=1e5;
  for(int i=0;i<7;i++){vec2 o=i==0?vec2(0.):vec2(cos(float(i)*1.0472),sin(float(i)*1.0472))*.135;vec3 q=p-vec3(0.,.2+o.y,o.x);
   float rr=.062+.009*sin(q.x*60.+o.x*30.);d=min(d,(length(q.yz)-rr)*.8);}
  d=max(d,abs(p.x)-1.3);
  vec2 t=vec2(1e5,2.);
  for(int k=-1;k<=1;k+=2){vec3 q=p-vec3(float(k)*.7,.2,0.);t.x=min(t.x,sdTorus(q.yxz,vec2(.21,.014)));}
  r=U(vec2(d,1.),t);
 } else if(M==10){ // profile pipe
  float d=1e5;
  for(int i=0;i<5;i++){float row=i<3?0.:1.;float col=i<3?float(i)-1.:float(i-3)-.5;vec3 q=p-vec3(0.,.1+row*.2,col*.43);
   float c=sdRBox(q,vec3(1.25,.1,.2),.015);c=max(c,-sdRBox(q,vec3(1.4,.082,.182),.01));d=min(d,c);}
  r=vec2(d,1.);
 } else if(M==11){ // drill / perforator
  float L0=V>.5?-.85:-.5;
  vec2 body=vec2(sdCap(p,vec3(L0,1.3,0.),vec3(.4,1.3,0.),V>.5?.26:.23),1.);
  body.x=smin(body.x,sdRBox(p-vec3(L0+.1,1.3,0.),vec3(.22,.3,.2),.12),.08);
  vec2 grip=vec2(sdCap(p,vec3(V>.5?-.62:-.12,1.1,0.),vec3(V>.5?-.72:-.28,.45,0.),.14),4.);
  vec2 bat=vec2(sdRBox(p-vec3(V>.5?-.62:-.25,.22,0.),vec3(.38,.2,.27),.06),V>.5?1.:4.);
  if(V>.5){bat.x=sdRBox(p-vec3(-.7,.3,0.),vec3(.24,.12,.2),.08);grip.x=min(grip.x,sdCap(p,vec3(-.7,.4,0.),vec3(-.95,1.15,0.),.1));}
  vec2 chuck=vec2(rcylX(p-vec3(.55,1.3,0.),.12,.16,.03),4.);
  vec2 bit=vec2(sdCap(p,vec3(.7,1.3,0.),vec3(V>.5?1.35:1.15,1.3,0.),.03),3.);
  vec2 side=vec2(1e5,4.);
  if(V>.5)side.x=sdCap(p,vec3(.35,1.3,.1),vec3(.45,1.05,.75),.07);
  vec2 stripe=vec2(sdRBox(p-vec3(L0+.1,1.3,0.),vec3(.235,.31,.205),.12)+.0,2.);
  stripe.x=max(stripe.x,abs(p.y-1.42)-.03);
  r=U(U(U(body,grip),U(bat,chuck)),U(U(bit,side),stripe));
 } else if(M==12){ // grinder
  vec2 body=vec2(sdCap(p,vec3(-1.0,.24,0.),vec3(.15,.24,0.),.2),1.);
  vec2 grip=vec2(sdCap(p,vec3(-1.05,.24,0.),vec3(-.55,.24,0.),.205),4.);
  vec2 head=vec2(sdRBox(p-vec3(.38,.27,0.),vec3(.22,.17,.2),.07),9.);
  vec2 disc=vec2(sdCyl(p-vec3(.55,.06,0.),.5,.012),2.);
  vec3 q=p-vec3(.55,.09,0.);
  vec2 guard=vec2(max(max(sdCyl(q,.54,.05),-sdCyl(q,.5,.2)),q.x-.05),9.);
  vec2 handle=vec2(sdCap(p,vec3(.35,.27,.1),vec3(.35,.27,.65),.06),4.);
  r=U(U(body,grip),U(U(head,disc),U(guard,handle)));
 } else if(M==13){ // hammer
  vec3 q=p;q.xz=rot(.42)*q.xz;
  vec2 h=vec2(sdCap(q,vec3(-1.0,.075,0.),vec3(.45,.075,0.),.075),2.);
  vec2 g=vec2(sdCap(q,vec3(-1.02,.08,0.),vec3(-.45,.08,0.),.085),4.);
  vec2 hd=vec2(sdRBox(q-vec3(.58,.13,0.),vec3(.11,.11,.34),.02),9.);
  hd.x=min(hd.x,rcylZ(q-vec3(.58,.13,.36),.1,.08,.02));
  r=U(U(h,g),hd);
 } else if(M==14){ // screwdriver set
  float dd=1e5,hh=1e5,ss=1e5;
  for(int i=0;i<5;i++){float fi=float(i)-2.;vec3 q=p-vec3(fi*.05,.09,fi*.27);q.xz=rot(fi*.05)*q.xz;
   float hand=smin(sdCap(q,vec3(-.85,0.,0.),vec3(-.35,0.,0.),.09),sdCap(q,vec3(-.35,0.,0.),vec3(-.28,0.,0.),.06),.05);
   if(mod(fi+2.,2.)<1.)hh=min(hh,hand);else dd=min(dd,hand);
   ss=min(ss,sdCap(q,vec3(-.3,0.,0.),vec3(.55,0.,0.),.026));}
  r=U(U(vec2(hh,1.),vec2(dd,2.)),vec2(ss,3.));
 } else if(M==15){ // tape measure
  vec2 b=vec2(sdRBox(p-vec3(0.,.55,0.),vec3(.52,.52,.22),.18),1.);
  vec2 s=vec2(sdRBox(p-vec3(0.,.55,0.),vec3(.4,.4,.235),.12),4.);
  s.x=max(s.x,-(sdCyl((p-vec3(0.,.55,0.)).xzy,.22,.5)));
  vec2 t=vec2(sdBox(p-vec3(.95,.07,0.),vec3(.48,.007,.1)),2.);
  t.x=min(t.x,sdBox(p-vec3(1.43,.1,0.),vec3(.01,.05,.11)));
  vec2 btn=vec2(sdRBox(p-vec3(0.,1.07,.0),vec3(.1,.04,.08),.03),4.);
  r=U(U(b,s),U(t,btn));
 } else if(M==16){ // laser level
  vec2 b=vec2(sdRBox(p-vec3(0.,.38,0.),vec3(.4,.34,.34),.1),1.);
  vec2 g=vec2(sdCyl(p-vec3(0.,.86,0.),.25,.15),6.);
  vec2 c=vec2(sdRCyl(p-vec3(0.,1.04,0.),.29,.04,.02),4.);
  vec2 k=vec2(rcylZ(p-vec3(.18,.42,.34),.07,.03,.01),4.);
  vec2 f=vec2(sdRBox(p-vec3(0.,.04,0.),vec3(.44,.04,.38),.03),4.);
  r=U(U(b,g),U(c,U(k,f)));
 } else if(M==17){ // cutting discs
  float d=1e5;
  for(int i=0;i<7;i++){float fi=float(i);vec3 q=p-vec3(sin(fi*2.3)*.03,.02+fi*.032,cos(fi*1.9)*.03);d=min(d,sdCyl(q,.85,.013));}
  d=max(d,-sdCyl(p,.11,1.));
  vec2 hub=vec2(max(sdCyl(p-vec3(0.,.235,0.),.2,.012),-sdCyl(p,.11,1.)),9.);
  r=U(vec2(d,1.),hub);
 } else if(M==18){ // fasteners pile
  float sh=1e5,hd=1e5,ex=1e5;
  for(int i=0;i<8;i++){float fi=float(i);
   vec3 c=vec3(sin(fi*2.4)*.55,0.,cos(fi*1.7)*.5-.05);
   vec3 q=p-c;q.xz=rot(fi*1.1+.3)*q.xz;
   float rad=V>1.5?.07:(V>.5?.06:.045);
   q.y-=rad+(V>1.5?.06:.05);
   float th=V>.5&&V<1.5?0.:.012*sin(q.x*70.);
   sh=min(sh,(sdCap(q,vec3(-.35,0.,0.),vec3(.35,0.,0.),rad)+th)*.8);
   if(V<.5)hd=min(hd,rcylX(q-vec3(-.38,0.,0.),.1,.025,.01));
   else if(V<1.5){ex=min(ex,sdCap(q,vec3(-.42,0.,0.),vec3(.3,0.,0.),.028));hd=min(hd,rcylX(q-vec3(-.45,0.,0.),.09,.012,.006));}
   else {hd=min(hd,sdRBox(q-vec3(.2,0.,0.),vec3(.06,.11,.11),.02));ex=min(ex,rcylX(q-vec3(.29,0.,0.),.12,.01,.005));}
  }
  if(V>.5&&V<1.5)r=U(U(vec2(sh,1.),vec2(hd,1.)),vec2(ex,3.));
  else r=U(U(vec2(sh,1.),vec2(hd,1.)),vec2(ex,9.));
 } else if(M==19){ // faucet
  vec2 pl=vec2(sdRCyl(p-vec3(0.,.025,0.),.32,.025,.012),3.);
  float d;
  if(V<.5){
   d=sdRCyl(p-vec3(0.,.42,0.),.17,.4,.06);
   d=smin(d,sdCap(p,vec3(0.,.68,0.),vec3(0.,.68,.58),.07),.05);
   d=min(d,sdRCyl(p-vec3(0.,.64,.6),.075,.08,.03));
   d=min(d,sdRCyl(p-vec3(0.,.86,0.),.17,.04,.02));
   d=min(d,sdCap(p,vec3(0.,.92,-.02),vec3(0.,1.02,-.5),.05));
  } else {
   d=sdRCyl(p-vec3(0.,.32,0.),.16,.3,.05);
   d=min(d,sdCap(p,vec3(0.,.55,0.),vec3(0.,1.25,0.),.06));
   vec3 q=p-vec3(0.,1.25,.36);
   float tor=length(vec2(length(q.yz)-.36,q.x))-.06;tor=max(tor,-q.y);
   d=min(d,tor);
   d=min(d,sdCap(p,vec3(0.,1.25,.72),vec3(0.,.98,.72),.065));
   d=min(d,sdCap(p,vec3(.12,.45,0.),vec3(.42,.6,0.),.045));
  }
  r=U(pl,vec2(d,3.));
 } else if(M==20){ // toilet
  vec3 q=p-vec3(0.,.43,.12);
  float bowl=sdEll(q,vec3(.45,.4,.6));bowl=max(bowl,q.y-.3);
  bowl=max(bowl,-max(sdEll(q-vec3(0.,.12,.0),vec3(.36,.38,.5)),-(q.y-.1)));
  float ped=sdRBox(p-vec3(0.,.2,.0),vec3(.24,.2,.3),.08);
  float b=smin(bowl,ped,.12);
  vec3 s=p-vec3(0.,.75,.12);s.z*=.82;
  float seat=sdTorus(s,vec2(.33,.05))*.8;
  float tank=sdRBox(p-vec3(0.,1.08,-.43),vec3(.48,.35,.17),.07);
  vec2 btn=vec2(sdCyl(p-vec3(0.,1.44,-.43),.07,.02),3.);
  r=U(U(vec2(b,5.),vec2(seat,5.)),U(vec2(tank,5.),btn));
 } else if(M==21){ // basin variants
  if(V<.5){
   vec3 q=p-vec3(0.,.45,0.);float k=clamp(1.-.2*(q.y/.45),.75,1.25);
   float ped=sdRCyl(vec3(q.x/k,q.y,q.z/k),.17,.45,.05)*k;
   vec3 b=p-vec3(0.,.98,.05);
   float basin=sdRBox(b,vec3(.62,.1,.42),.1);
   basin=smin(basin,sdEll(b-vec3(0.,-.02,0.),vec3(.6,.22,.4)),.08);
   basin=max(basin,-sdEll(b-vec3(0.,.15,.06),vec3(.48,.22,.3)));
   vec2 tap=vec2(sdCap(p,vec3(0.,1.08,-.25),vec3(0.,1.3,-.25),.05),3.);
   tap.x=min(tap.x,sdCap(p,vec3(0.,1.3,-.25),vec3(0.,1.3,-.05),.04));
   r=U(vec2(smin(ped,basin,.05),5.),tap);
  } else if(V<1.5){
   vec3 q=p-vec3(0.,.12,0.);
   float s=sdRBox(q,vec3(.8,.11,.58),.03);
   s=max(s,-sdRBox(q-vec3(-.15,.12,0.),vec3(.48,.2,.44),.08));
   vec2 dr=vec2(sdCyl(p-vec3(-.15,.02,0.),.09,.03),4.);
   vec2 tap=vec2(sdCap(p,vec3(.6,.22,-.35),vec3(.6,.75,-.35),.045),3.);
   tap.x=min(tap.x,sdCap(p,vec3(.6,.75,-.35),vec3(.6,.75,-.05),.04));
   r=U(U(vec2(s,1.),dr),tap);
  } else {
   float cab=sdRBox(p-vec3(0.,.45,0.),vec3(.62,.45,.42),.03);
   float seam=sdBox(p-vec3(0.,.45,.42),vec3(.006,.4,.02));
   cab=max(cab,-seam);
   vec2 h=vec2(sdCap(p,vec3(-.1,.78,.45),vec3(.1,.78,.45),.022),3.);
   h.x=min(h.x,sdCap(p,vec3(-.1,.6,.45),vec3(-.1,.6,.45),.022));
   vec3 b=p-vec3(0.,.97,0.);
   float top=sdRBox(b,vec3(.66,.07,.46),.05);
   top=max(top,-sdEll(b-vec3(0.,.07,.05),vec3(.5,.13,.32)));
   vec2 tap=vec2(sdCap(p,vec3(0.,1.04,-.32),vec3(0.,1.32,-.32),.045),3.);
   tap.x=min(tap.x,sdCap(p,vec3(0.,1.32,-.32),vec3(0.,1.32,-.12),.04));
   r=U(U(vec2(cab,1.),vec2(top,5.)),U(h,tap));
  }
 } else if(M==22){ // bath
  float b=sdRBox(p-vec3(0.,.36,0.),vec3(1.25,.36,.6),.18);
  b=max(b,-sdRBox(p-vec3(0.,.64,0.),vec3(1.1,.45,.47),.28));
  vec2 dr=vec2(sdCyl(p-vec3(-.75,.62,.0).xzy,.04,.02),3.);
  r=U(vec2(b,5.),vec2(1e5,3.));
 } else if(M==23){ // shower column + wall
  vec2 w=vec2(sdBox(p-vec3(0.,1.2,-.12),vec3(.9,1.2,.02)),2.);
  float d=sdCap(p,vec3(0.,.8,0.),vec3(0.,2.05,0.),.035);
  d=min(d,sdCap(p,vec3(0.,2.05,0.),vec3(0.,2.05,.42),.03));
  d=min(d,sdRCyl(p-vec3(0.,2.0,.48),.3,.02,.015));
  d=min(d,sdRBox(p-vec3(0.,.85,.02),vec3(.26,.08,.07),.05));
  d=min(d,rcylZ(p-vec3(-.3,.85,.04),.07,.05,.02));
  d=min(d,rcylZ(p-vec3(.3,.85,.04),.07,.05,.02));
  d=min(d,sdCap(p,vec3(.12,1.2,.05),vec3(.12,1.55,.12),.045));
  d=min(d,rcylZ(p-vec3(0.,.85,-.08),.08,.04,.02));
  r=U(w,vec2(d,3.));
 } else if(M==24){ // pipes / fittings
  float d=1e5;
  if(V<.5){
   for(int i=0;i<6;i++){float row=i<3?0.:(i<5?1.:2.);float col=i<3?float(i)-1.:(i<5?float(i-3)-.5:0.);
    vec3 q=p-vec3(0.,.1+row*.172,col*.2);float c=cylX(q,.1,1.3);c=max(c,-cylX(q,.075,1.4));d=min(d,c);}
   r=vec2(d,1.);
  } else {
   for(int i=0;i<7;i++){float fi=float(i);vec3 c=vec3(sin(fi*2.6)*.55,.11,cos(fi*1.9)*.45);vec3 q=p-c;q.xz=rot(fi*1.3)*q.xz;
    float e;
    if(mod(fi,2.)<1.){vec3 t=q-vec3(-.14,0.,-.14);e=sdTorus(t,vec2(.2,.1));e=max(e,max(-t.x,-t.z));e=min(e,rcylX(q-vec3(-.14,0.,.06),.115,.06,.01));e=min(e,rcylZ(q-vec3(.06,0.,-.14),.115,.06,.01));}
    else {e=rcylX(q,.11,.26,.015);e=min(e,rcylZ(q-vec3(0.,0.,.14),.11,.14,.015));}
    d=min(d,e);}
   r=vec2(d,1.);
  }
 } else if(M==25){ // water heater
  vec2 b=vec2(sdRCyl(p-vec3(0.,1.08,0.),.48,.98,.38),1.);

vec3 env(vec3 d){

 float s1=smoothstep(.82,.96,dot(d,normalize(vec3(-.6,.75,.45))));

 else if(t==1){m.rough=.42;}

 else if(t==5){vec3 q=p*vec3(1.,1.,1.);float w=fbm(q*vec3(1.5,14.,14.));float ring=sin((q.y*30.+q.z*22.+w*9.));m.alb=mix(col*.68,col*1.06,smoothstep(-.6,.9,ring));m.alb*=.9+.2*noise(q*vec3(2.,60.,60.));m.rough=.55;}
