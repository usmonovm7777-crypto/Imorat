name: Android app (APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "app/**", "config.js", ".github/workflows/android.yml"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build website
        run: python3 tools/build_site.py
      - name: Install Capacitor
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Create Android project
        working-directory: app
        run: |
          npm run www
          [ -d android ] || npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#0B6E69' --splashBackgroundColor '#F3F5F2' || echo "icons: using defaults"
          npx cap sync android
      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: imorat-android
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish to the "app-latest" release (download from a phone)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk Imorat.apk
          gh release view app-latest >/dev/null 2>&1 || gh release create app-latest --prerelease --title "Imorat — Android (тестовая сборка)" --notes "Последняя тестовая сборка приложения. Скачайте Imorat.apk на телефон Android и установите."
          gh release upload app-latest Imorat.apk --clobber
