  if (!STORE[sellerStore]) sellerStore = myStore && STORE[myStore.id] ? myStore.id : STORES[0].id;
  const s = STORE[sellerStore], mine = PRODUCTS.filter(p => p.offers.some(o => o.store === s.id)), ords = sellerOrders(s.id);
  const seed = s.id.split("").reduce((a, ch) => a + ch.charCodeAt(0), 0);
  const todayIdx = (new Date().getDay() + 6) % 7;
  const days = [L("Пн", "Du"), L("Вт", "Se"), L("Ср", "Ch"), L("Чт", "Pa"), L("Пт", "Ju"), L("Сб", "Sh"), L("Вс", "Ya")];
  const rev = days.map((_, i) => s.mine ? 0 : 4 + ((seed * (i + 3)) % 17) + (i >= 5 ? 6 : 0));
  const realSum = ords.filter(o => o.real).reduce((a, o) => a + o.sum, 0);
  rev[todayIdx] += Math.round(realSum / 1e6 * 10) / 10;
  const week = rev.reduce((a, b) => a + b, 0), newCount = ords.filter(o => o.st === "new").length, avg = ords.reduce((a, o) => a + o.sum, 0) / (ords.length || 1);
  const W = 560, H = 210, pad = 28, bw = (W - pad * 2) / 7, mx = Math.max(5, Math.ceil(Math.max(...rev) / 5) * 5);
  const y = val => H - 30 - (val / mx) * (H - 60);
  const chart = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${L("Выручка по дням, млн сум", "Kunlik tushum, mln so‘m")}">
    ${[0, mx / 2, mx].map(g => `<line class="grid-l" x1="${pad}" x2="${W - pad}" y1="${y(g)}" y2="${y(g)}"/><text x="${pad - 6}" y="${y(g) + 4}" text-anchor="end">${g}</text>`).join("")}
    ${rev.map((r, i) => { const x = pad + i * bw + bw * 0.18, w = bw * 0.64; return `<rect class="bar ${i === todayIdx ? "today" : ""}" x="${x}" y="${y(r)}" width="${w}" height="${H - 30 - y(r)}" rx="5"/><text class="val" x="${x + w / 2}" y="${y(r) - 6}" text-anchor="middle">${String(Math.round(r * 10) / 10).replace(".", ",")}</text><text x="${x + w / 2}" y="${H - 10}" text-anchor="middle">${days[i]}</text>`; }).join("")}
  </svg>`;
  const stLabel = { new: [L("Новый", "Yangi"), "sig"], packed: [L("Собран", "Yig‘ildi"), "warn"], handed: [L("У курьера", "Kuryerda"), "acc"], done: [L("Доставлен", "Yetkazildi"), "ok"] };
  const nextBtn = { new: L("Собрать", "Yig‘ish"), packed: L("Передать курьеру", "Kuryerga berish"), handed: L("Отметить доставку", "Yetkazildi deb belgilash") };
  $("#app").innerHTML = `<div class="wrap">
    <nav class="crumbs"><button type="button" data-go="home">${L("Главная", "Asosiy")}</button>${ui("chev", 12)}<span>${L("Кабинет продавца", "Sotuvchi kabineti")}</span></nav>
    <div class="s-head" style="padding-top:4px"><div><h1 class="h-l">${esc(s.name)}</h1><p>${dName(s.d)}, ${L(s.addr, s.addrUz)} · ${s.hours} · <span class="pill mute">${L("демо-кабинет", "demo kabinet")}</span></p></div>
      <div class="f" style="min-width:200px"><label for="sStore">${L("Магазин", "Do‘kon")}</label><select class="sel" id="sStore">${[...(myStore ? [myStore] : []), ...STORES].map(x => `<option value="${x.id}" ${x.id === s.id ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></div></div>
    ${s.mine ? storeBanner(s, true) + storeCardHTML(s) : ""}
    <div class="kpis">
      <div class="kpi"><span>${L("Новых заказов", "Yangi buyurtmalar")}</span><b>${newCount}</b><small style="color:${newCount ? "var(--signal)" : "var(--ok)"}">${newCount ? L("Ждут сборки", "Yig‘ishni kutmoqda") : L("Все собраны", "Hammasi yig‘ilgan")}</small></div>
      <div class="kpi"><span>${L("Выручка за 7 дней", "7 kunlik tushum")}</span><b>${String(Math.round(week * 10) / 10).replace(".", ",")} ${L("млн", "mln")}</b><small>${s.mine ? L("новый магазин", "yangi do‘kon") : `+${8 + seed % 9}% ${L("к прошлой неделе", "o‘tgan haftaga")}`}</small></div>
      <div class="kpi"><span>${L("Средний чек", "O‘rtacha chek")}</span><b>${fmtN(avg / 1000)} ${L("тыс", "ming")}</b><small>${L("сум", "so‘m")}</small></div>
      <div class="kpi"><span>${L("Товаров в каталоге", "Katalogdagi mahsulotlar")}</span><b>${mine.length}</b><small style="color:var(--muted)">${mine.filter(p => !photos[p.id]).length} ${L("без своих фото", "o‘z rasmisiz")}</small></div>
    </div>
    <div class="s-grid">
      <div class="panel"><div class="panel-h"><h2 class="h-m">${L("Выручка по дням", "Kunlik tushum")}</h2><span class="pill mute">${L("млн сум", "mln so‘m")}</span></div>${chart}</div>
      <div class="panel"><div class="panel-h"><h2 class="h-m">${L("Заказы", "Buyurtmalar")}</h2><span class="pill acc">${L("доставка Яндекс", "Yandex yetkazish")}</span></div>
        <div class="tbl-wrap"><table><thead><tr><th>${L("Заказ", "Buyurtma")}</th><th>${L("Состав", "Tarkibi")}</th><th class="r">${L("Сумма", "Summa")}</th><th>${L("Статус", "Holat")}</th><th></th></tr></thead><tbody>
        ${ords.map(o => `<tr><td><b class="mono">${o.num}</b><br><small style="color:var(--muted)">${esc(o.buyer)} · ${L(DIST[o.d].ru, DIST[o.d].uz)}</small></td><td style="min-width:180px;font-size:13px">${esc(o.items)}<br><small style="color:var(--muted)">${o.tariff ? tName(o.tariff) : L("Самовывоз", "Olib ketish")}</small></td><td class="r">${fmt(o.sum)}</td><td><span class="pill ${stLabel[o.st][1]}">${stLabel[o.st][0]}</span></td><td>${nextBtn[o.st] ? `<button class="btn ${o.st === "new" ? "btn-primary" : "btn-line"}" type="button" data-sst="${o.num}|${s.id}|${o.st}">${nextBtn[o.st]}</button>` : ""}</td></tr>`).join("")}
        </tbody></table></div></div>
    </div>
    <div class="panel" style="margin-top:12px"><div class="panel-h"><h2 class="h-m">${L("Товары, фото и остатки", "Mahsulotlar, rasmlar va qoldiqlar")}</h2><span style="font-size:13px;color:var(--muted)">${L("Загрузите реальное фото — оно сразу заменит изображение на витрине", "Haqiqiy rasm yuklang — vitrinadagi tasvir darhol almashadi")}</span></div>
      <div class="tbl-wrap"><table><thead><tr><th>${L("Товар", "Mahsulot")}</th><th>${L("Категория", "Toifa")}</th><th class="r">${L("Ваша цена", "Narxingiz")}</th><th class="r">${L("Мин. на рынке", "Bozordagi min.")}</th><th class="r">${L("Остаток", "Qoldiq")}</th></tr></thead><tbody>
      ${mine.slice(0, sellerAll ? 9999 : 30).map(p => { const my = p.offers.find(o => o.store === s.id).price, mn = minPrice(p); return `<tr><td><div class="pcell">${mini(p)}<span>${esc(pName(p))}${p.mine ? ` <span class="pill acc">${L("ваш", "sizniki")}</span>` : ""}<br><button class="ph-btn" type="button" data-photo="${p.id}">${ui("photo", 14)} ${photos[p.id] ? L("Заменить фото", "Rasmni almashtirish") : L("Загрузить фото", "Rasm yuklash")}</button>${photos[p.id] ? ` <button class="ph-btn" type="button" data-photodel="${p.id}" style="color:var(--muted)">${L("Убрать", "Olib tashlash")}</button>` : ""}</span></div></td><td style="font-size:13px">${catName(p.cat)}</td><td class="r">${fmt(my)}</td><td class="r" style="color:${my > mn ? "var(--signal)" : "var(--ok)"}">${my > mn ? fmt(mn) : L("вы дешевле всех", "eng arzon siz")}</td><td class="r"><label class="visually-hidden" for="stk${p.id}">${L("Остаток", "Qoldiq")}</label><input class="stk num" id="stk${p.id}" type="number" min="0" value="${stockOf(p, s.id)}" data-stk="${p.id}|${s.id}"></td></tr>`; }).join("")}
      </tbody></table></div>${mine.length > 30 && !sellerAll ? `<button class="btn btn-line" type="button" data-act="seller-all" style="justify-self:start">${L("Показать все товары", "Barcha mahsulotlar")} · ${mine.length}</button>` : ""}</div>
    <div class="panel" style="margin:12px 0 32px"><div class="panel-h"><h2 class="h-m">${L("Добавить товар", "Mahsulot qo‘shish")}</h2></div>
      <form class="add-form" id="addForm" novalidate>
        <div class="f wide"><label for="aRu">${L("Название (рус.)", "Nomi (rus.)")}</label><input id="aRu" name="ru" required placeholder="${L("Например: Клей для газоблока, 25 кг", "Masalan: Gazoblok yelimi, 25 kg")}"></div>
        <div class="f wide"><label for="aUz">${L("Название (узб.)", "Nomi (o‘zb.)")}</label><input id="aUz" name="uz" placeholder="Gazoblok yelimi, 25 kg"></div>
        <div class="f"><label for="aCat">${L("Категория", "Toifa")}</label><select id="aCat" name="cat">${CATS.map(c => `<option value="${c.id}">${L(c.ru, c.uz)}</option>`).join("")}</select></div>
        <div class="f"><label for="aSub">${L("Подкатегория", "Bo‘lim")}</label><select id="aSub" name="sub"></select></div>
        <div class="f"><label for="aUnit">${L("Единица", "O‘lchov")}</label><select id="aUnit" name="unit">${Object.keys(UNITS).map(u => `<option value="${u}">${unitName(u)}</option>`).join("")}</select></div>
        <div class="f"><label for="aPrice">${L("Цена, сум", "Narx, so‘m")}</label><input id="aPrice" name="price" type="number" min="100" inputmode="numeric" placeholder="54000"></div>
        <div class="f"><label for="aKg">${L("Вес единицы, кг", "Birlik vazni, kg")}</label><input id="aKg" name="kg" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="25"></div>
        <div class="f"><label for="aStock">${L("Остаток", "Qoldiq")}</label><input id="aStock" name="stock" type="number" min="0" inputmode="numeric" placeholder="40"></div>
        <div class="f wide"><label for="aDesc">${L("Описание", "Tavsif")}</label><input id="aDesc" name="desc" placeholder="${L("Для чего подходит, расход, особенности", "Nima uchun mos, sarfi, xususiyatlari")}"></div>
        <div class="f wide"><span>${L("Фото", "Rasm")}</span><button class="drop" type="button" data-photo="new" id="aPhotoPv">${ui("photo", 20)} ${L("Выбрать фото товара", "Mahsulot rasmini tanlash")}</button></div>
        <div class="f wide" style="grid-column:1/-1"><span class="err" id="addErr" hidden>${L("Заполните название, цену и вес — по весу подбирается тариф доставки.", "Nomi, narxi va vaznini kiriting — tarif vazn bo‘yicha tanlanadi.")}</span><button class="btn btn-primary" type="submit" style="justify-self:start">${ui("plus", 18)} ${L("Опубликовать на витрине", "Vitrinaga joylash")}</button></div>
      </form></div>
  </div>`;
  const fillSub = () => { $("#aSub").innerHTML = CAT[$("#aCat").value].subs.map(x => `<option value="${x[0]}">${L(x[1], x[2])}</option>`).join(""); };
  $("#aCat").addEventListener("change", fillSub); fillSub();
  $("#sStore").addEventListener("change", e => { sellerStore = e.target.value; LS.set("imorat.sellerStore", sellerStore); renderSeller(); });
  document.querySelectorAll("[data-stk]").forEach(i => i.addEventListener("change", e => { stockOv[e.target.dataset.stk] = Math.max(0, parseInt(e.target.value, 10) || 0); LS.set("imorat.stock", stockOv); toast(L("Остаток обновлён", "Qoldiq yangilandi")); }));
  $("#addForm").addEventListener("submit", e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target).entries());
    const price = parseInt(d.price, 10), kg = parseFloat(String(d.kg).replace(",", "."));
    const ok = d.ru.trim().length > 2 && price > 0 && kg > 0; $("#addErr").hidden = ok; if (!ok) return;
    const extra = LS.get("imorat.extra", []);
    extra.push({ cat: d.cat, sub: d.sub, ru: d.ru.trim(), uz: d.uz.trim() || d.ru.trim(), unit: d.unit, price, kg, store: s.id, stock: parseInt(d.stock, 10) || 0, desc: d.desc.trim() });
    LS.set("imorat.extra", extra); buildProducts();
    if (newPhoto) { photos[1000 + extra.length - 1] = newPhoto; LS.set("imorat.photos", photos); newPhoto = ""; }
    renderSeller(); toast(L("Товар опубликован на витрине", "Mahsulot vitrinaga joylandi"));
  });
}

/* ================= Router & render ================= */
function parseHash() {
  const h = location.hash.slice(1);
  if (h === "seller") return { view: "seller", cat: null };
  if (h === "design") return { view: "design", cat: null };
  if (h === "catalog") return { view: "catalog", cat: null };
  if (h.startsWith("cat-") && CAT[h.slice(4)]) return { view: "catalog", cat: h.slice(4) };
  return { view: "home", cat: null };
}
function renderMain() {
  if (route.view === "catalog") renderCatalog();
  else if (route.view === "seller") renderSeller();
  else if (route.view === "design") renderDesign();
  else renderHome();
  renderTabbar(); counts(); settleMotion();
}
function renderAll() { renderHeader(); renderFooter(); renderMain(); if (drawerView) renderDrawer(); if (aiOpen) renderAI(); }
function go(h, sub) {
  closeMega(); closeModal(); if (drawerView) closeDrawer(); if (aiOpen) closeAI(); if (widOpen) closeWidgets();
  f.sub = sub || null; f.stores = []; f.max = 0;
  if (h !== "catalog") f.q = "";
  if ((location.hash.slice(1) || "home") === h) { route = parseHash(); renderMain(); const qi = $("#q"); if (qi) qi.value = f.q; }
  else location.hash = h;
  window.scrollTo(0, 0);
}
function routeTo() { const prevCat = route.cat; route = parseHash(); if (route.cat !== prevCat) { f.sub = null; f.max = 0; } renderMain(); const qi = $("#q"); if (qi) qi.value = f.q; window.scrollTo(0, 0); }
window.addEventListener("hashchange", () => { if (document.startViewTransition && motionOK()) document.startViewTransition(routeTo); else routeTo(); });
function scrollToSec(id) {
  closeMega(); if (drawerView) closeDrawer(); if (aiOpen) closeAI(); if (widOpen) closeWidgets();
  const doIt = () => { const el = document.getElementById(id); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - ($("#hdr").offsetHeight + 12), behavior: "smooth" }); };
  if (route.view !== "home") { location.hash = "home"; setTimeout(doIt, 80); } else doIt();
}

document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset && t.dataset.svc) { const id = +t.dataset.svc; if (t.checked) { services[id] = true; if (!qtyOf(id)) addToCart(id, null, 1, true); toast(L("Установка мастером добавлена в корзину", "Usta o‘rnatishi savatga qo‘shildi")); } else delete services[id]; LS.set("imorat.svc", services); }
});
document.addEventListener("click", e => {
  const t = e.target.closest("[data-go],[data-act],[data-open],[data-add],[data-addo],[data-fav],[data-inc],[data-dec],[data-lang],[data-sub],[data-store],[data-q],[data-scroll],[data-calc],[data-clear],[data-order],[data-sst],[data-bundle],[data-ask],[data-askp],[data-aiadd],[data-aiall],[data-svcoff],[data-photo],[data-photodel],[data-cmp],[data-oauth],[data-authstep],[data-wview],[data-wcalc],[data-watch],[data-repeat],[data-projload],[data-projdel],[data-calccopy],[data-calcproj]");
  if (!t) return;
  const ds = t.dataset;
  if (ds.go !== undefined) return go(ds.go, ds.sub);
  if (ds.sub !== undefined) { f.sub = ds.sub || null; document.querySelectorAll(".chips [data-sub]").forEach(b => b.setAttribute("aria-pressed", (b.dataset.sub || null) === f.sub)); return renderList(); }
  if (ds.open) { e.preventDefault(); if (aiOpen && window.innerWidth <= 760) closeAI(); return openProduct(+ds.open); }
  if (ds.add) { fly(t); return addToCart(+ds.add); }
  if (ds.watch) { const id = +ds.watch; watch = watch.includes(id) ? watch.filter(x => x !== id) : [...watch, id]; LS.set("imorat.watch", watch); toast(watch.includes(id) ? L("Следим за ценой — товар в профиле", "Narx kuzatilmoqda — profilda") : L("Больше не следим за ценой", "Narx kuzatilmaydi")); if ($("#modal").classList.contains("on")) openProduct(id); if (drawerView === "watch") renderDrawer(); return; }
  if (ds.repeat) { const o = orders.find(x => x.num === ds.repeat); if (o) { o.ships.forEach(sh => sh.lines.forEach(l => { if (PROD[l.id]) { const k = l.id + "|" + sh.store; cart[k] = (cart[k] || 0) + l.q; } })); saveCart(); refreshCards(); toast(L("Товары заказа снова в корзине", "Buyurtma mahsulotlari yana savatda")); openDrawer("cart"); } return; }
  if (ds.projload) { const pr = projects.find(x => x.id === ds.projload); if (pr) { Object.entries(pr.cart).forEach(([k, q]) => { if (PROD[k.split("|")[0]]) cart[k] = Math.max(cart[k] || 0, q); }); saveCart(); refreshCards(); toast(L(`Проект «${pr.name}» в корзине`, `«${pr.name}» loyihasi savatda`)); openDrawer("cart"); } return; }
  if (ds.projdel) { projects = projects.filter(x => x.id !== ds.projdel); LS.set("imorat.projects", projects); return renderDrawer(); }
  if (ds.wview) { wView = ds.wview; return renderWidgets(); }
  if (ds.wcalc) { wCalc = ds.wcalc; wScrollCalc = true; return renderWidgets(); }
  if (ds.calccopy) { const key = ds.calccopy, c = CALCS.find(x => x.id === key.split(":")[1]); const res = [...document.querySelectorAll(`#${key.replace(":", "-")}-res > div`)].map(d => d.innerText.replace(/\s*\n\s*/g, ": ")).join("\n"); const txt = `${L(c.ru, c.uz)}\n${res}\n${(calcOut[key] || []).map(([p, q]) => `• ${pName(p)} × ${q}`).join("\n")}\nimorat`;
    navigator.clipboard?.writeText(txt).then(() => toast(L("Расчёт скопирован — можно отправить мастеру", "Hisob nusxalandi — ustaga yuborish mumkin")), () => toast(L("Не удалось скопировать, выделите текст вручную", "Nusxalab bo‘lmadi, matnni qo‘lda belgilang"))) ?? toast(L("Копирование недоступно в этом окне", "Bu oynada nusxalash mavjud emas")); return; }
  if (ds.calcproj) { const key = ds.calcproj, c = CALCS.find(x => x.id === key.split(":")[1]), items = calcOut[key] || []; if (!items.length) return toast(L("Нечего сохранять", "Saqlash uchun hech narsa yo‘q")); const pc = {}; items.forEach(([p, q]) => { pc[p.id + "|" + bestOffer(p).store] = q; }); const nm = L(c.ru, c.uz) + " · " + new Date().toLocaleDateString("ru-RU"); projects.unshift({ id: "pr" + Date.now().toString(36), name: nm, cart: pc, t: Date.now() }); LS.set("imorat.projects", projects); return toast(L(`Сохранено в «Проекты ремонта»`, `«Ta’mir loyihalari»ga saqlandi`)); }
  if (ds.oauth) return startOAuth(ds.oauth);
  if (ds.authstep) { auth.step = ds.authstep; auth.err = ""; return renderAuth(); }
  if (ds.cmp) { toggleCompare(+ds.cmp); return openProduct(+ds.cmp); }
  if (ds.addo) { const [id, s] = ds.addo.split("|"); addToCart(+id, s); return openProduct(+id); }
  if (ds.fav) return toggleFav(+ds.fav);
  if (ds.inc) { cart[ds.inc]++; saveCart(); dCart(); return refreshCards(); }
  if (ds.dec) { cart[ds.dec]--; if (cart[ds.dec] <= 0) delete cart[ds.dec]; saveCart(); dCart(); return refreshCards(); }
  if (ds.lang) { lang = ds.lang; LS.set("imorat.lang", lang); return renderAll(); }
  if (ds.store) { f.stores = [ds.store]; f.q = ""; f.sub = null; f.max = 0; if (location.hash === "#catalog") { route = parseHash(); renderMain(); } else location.hash = "catalog"; return window.scrollTo(0, 0); }
  if (ds.q) { f.q = ds.q; route = { view: "catalog", cat: null }; history.replaceState(null, "", "#catalog"); renderMain(); $("#q").value = f.q; return window.scrollTo(0, 0); }
  if (ds.scroll) return scrollToSec(ds.scroll);
  if (ds.calc) { const items = calcOut[ds.calc] || []; items.forEach(([p, q]) => q > 0 && addToCart(p.id, null, q, true)); toast(L("Материалы добавлены в корзину", "Materiallar savatga qo‘shildi")); return; }
  if (ds.clear) { const c = ds.clear; if (c === "q") { f.q = ""; $("#q").value = ""; } else if (c === "stock") f.inStock = false; else if (c.startsWith("store:")) f.stores = f.stores.filter(x => x !== c.slice(6)); return renderCatalog(); }
  if (ds.order) return openDrawer("track", ds.order);
  if (ds.bundle) return addBundle(ds.bundle);
  if (ds.ask) return openAI(ds.ask);
  if (ds.askp) { const p = PROD[ds.askp]; return openAI(L(`Расскажи про [[${p.id}]]: для чего подходит, сколько обычно нужно и что купить вместе? Есть ли варианты лучше?`, `[[${p.id}]] haqida ayt: nima uchun mos, odatda qancha kerak va birga nima olish kerak? Yaxshiroq variantlar bormi?`)); }
  if (ds.aiadd) { const [id, q] = ds.aiadd.split("|"); fly(t); addToCart(+id, null, +q || 1); return; }
  if (ds.aiall) { ds.aiall.split(",").forEach(x => { const [id, q] = x.split(":"); addToCart(+id, null, +q || 1, true); }); return toast(L("Подборка Usta AI добавлена в корзину", "Usta AI tanlovi savatga qo‘shildi")); }
  if (ds.svcoff) { delete services[ds.svcoff]; LS.set("imorat.svc", services); return dCart(); }
  if (ds.photo) { photoTarget = ds.photo === "new" ? "new" : +ds.photo; return $("#photoIn").click(); }
  if (ds.photodel) { delete photos[ds.photodel]; LS.set("imorat.photos", photos); return renderSeller(); }
  if (ds.sst) { const [num, sid, st] = ds.sst.split("|"); const nx = { new: "packed", packed: "handed", handed: "done" }[st]; sellerSt[num + "|" + sid] = nx; LS.set("imorat.sst", sellerSt); toast(nx === "handed" ? L("Заявка в Яндекс Доставку создана", "Yandex Yetkazishga ariza yaratildi") : L("Статус обновлён", "Holat yangilandi")); return renderSeller(); }
  switch (ds.act) {
    case "mega": return openMega();
    case "close-mega": return closeMega();
    case "cart": return openDrawer("cart");
    case "favs": return openDrawer("favs");
    case "profile": return openDrawer("profile");
    case "orders": return openDrawer("orders");
    case "checkout": return user ? openDrawer("checkout") : openAuth("checkout");
    case "login": return openAuth();
    case "store-reg": return openStoreReg();
    case "store-edit": return openAuth("seller-edit", "store");
    case "store-approve-demo": if (myStore) { myStore.status = "active"; LS.set("imorat.myStore", myStore); toast(L("Демо: магазин одобрен", "Demo: do‘kon tasdiqlandi")); } return renderSeller();
    case "seller-reload": sellerData = null; adminStores = null; adminFin = null; return renderSeller();
    case "install": if (widOpen) closeWidgets(); return installApp();
    case "fx-toggle": { const on = !motionOK(); setLook(on ? "on" : "off"); toast(on ? L("✨ Яркий режим: подсветка и анимации", "✨ Yorqin rejim: yoritish va animatsiyalar") : L("Простой режим: без анимаций", "Oddiy rejim: animatsiyalarsiz")); return; }
    case "tg-link": return linkTelegram();
    case "tg-unlink": return unlinkTelegram();
    case "push-on": return enablePush();
    case "logout-all": return logoutAll();
    case "mfa-setup": adminApi("POST", "/api/admin/mfa/setup").then(r => { adminState = { need: "setup", secret: r.secret, url: r.url }; renderSeller(); }).catch(e => toast(apiErr(e))); return;
    case "order-cancel": { const num = drawerOrder; api("POST", `/api/orders/${encodeURIComponent(num)}/cancel`).then(r => { const o = orders.find(x => x.num === num); Object.assign(o, mapOrder(r.order)); LS.set("imorat.orders", orders.slice(0, 30)); toast(L("Заказ отменён", "Buyurtma bekor qilindi")); renderDrawer(); syncCatalog(); }).catch(e => toast(e.code === "too_late" ? L("Заказ уже в пути — отменить нельзя", "Buyurtma yo‘lda — bekor qilib bo‘lmaydi") : apiErr(e))); return; }
    case "close-auth": return closeAuth();
    case "logout": return logout();
    case "auth-resend": return sendCode();
    case "more": shownN += 36; return renderList(true);
    case "seller-all": sellerAll = true; return renderSeller();
    case "close-drawer": return closeDrawer();
    case "close-all": if (drawerView) closeDrawer(); if (aiOpen) closeAI(); if (widOpen) closeWidgets(); return;
    case "watch": return openDrawer("watch");
    case "projects": return openDrawer("projects");
    case "proj-open": { const b = $("#saveProj"); b.hidden = false; $("#projName").focus(); return; }
    case "proj-save": { const nm = ($("#projName").value || "").trim() || L("Проект", "Loyiha") + " " + (projects.length + 1); projects.unshift({ id: "pr" + Date.now().toString(36), name: nm, cart: { ...cart }, t: Date.now() }); LS.set("imorat.projects", projects); toast(L(`Проект «${nm}» сохранён`, `«${nm}» loyihasi saqlandi`)); return dCart(); }
    case "promo": { const code = ($("#fPromo").value || "").trim().toUpperCase(); const m = $("#promoMsg");
      if (!PROMO[code]) { promo = ""; m.className = "promo-msg bad"; m.textContent = L("Такого промокода нет", "Bunday promokod yo‘q"); }
      else if (promoUsed().includes(user ? user.id : "guest")) { promo = ""; m.className = "promo-msg bad"; m.textContent = L("Промокод уже использован в вашем аккаунте", "Promokod akkauntingizda allaqachon ishlatilgan"); }
      else { promo = code; m.className = "promo-msg ok"; m.textContent = L("Скидка 5% на товары применена (до 300 000 сум)", "Mahsulotlarga 5% chegirma qo‘llandi (300 000 so‘mgacha)"); }
      LS.set("imorat.promoCode", promo); return updateQuote(); }
    case "widgets": return widOpen ? closeWidgets() : openWidgets();
    case "close-wid": return closeWidgets();
    case "w-calc": return openWidgets("calc");
    case "ai-calc": { const c = CALCS.find(x => x.id === wCalc), items = calcOut["w:" + wCalc] || []; const rows = [...document.querySelectorAll("#w-" + wCalc + "-res > div")].map(d => d.innerText.replace(/\s+/g, " ")).join("; "); return openAI(L(`Проверь мой расчёт «${c.ru}»: ${rows}. Материалы: ${items.map(([p, q]) => `[[${p.id}:${q}]]`).join(", ")}. Всё ли учтено и что ещё понадобится?`, `«${c.uz}» hisobimni tekshir: ${rows}. Materiallar: ${items.map(([p, q]) => `[[${p.id}:${q}]]`).join(", ")}. Hammasi hisobga olinganmi, yana nima kerak?`)); }
    case "close-modal": return closeModal();
    case "d-back": return openDrawer(drawerView === "track" ? "orders" : ["orders", "watch", "projects"].includes(drawerView) ? "profile" : "cart");
    case "reset": f = { q: "", sub: null, stores: [], inStock: false, max: 0, sort: "pop" }; $("#q").value = ""; return renderCatalog();
    case "favs-all": favs.forEach(id => PROD[id] && addToCart(id, null, 1, true)); toast(L("Избранное добавлено в корзину", "Saralanganlar savatga qo‘shildi")); return openDrawer("cart");
    case "vip-on": if (API) return user ? setVipApi(true) : openAuth(); vip = true; LS.set("imorat.vip", vip); toast(L("VIP подключён: первый месяц бесплатно", "VIP ulandi: birinchi oy bepul")); if (route.view === "home") $("#vip").innerHTML = vipBlock(); if (drawerView) renderDrawer(); return;
    case "vip-off": if (API) return user ? setVipApi(false) : openAuth(); vip = false; LS.set("imorat.vip", vip); toast(L("VIP отключён", "VIP o‘chirildi")); if (route.view === "home") $("#vip").innerHTML = vipBlock(); if (drawerView) renderDrawer(); return;
    case "ai": return openAI();
    case "close-ai": return closeAI();
    case "ai-clear": aiCtl?.abort(); aiMsgs = []; return renderAI();
    case "ai-unattach": aiFile = null; aiFileURL = ""; $("#aiAtt").hidden = true; $("#aiFile").value = ""; return;
    case "ask-search": return openAI(f.q.trim() ? L(`Помоги выбрать: ${f.q.trim()}`, `Tanlashga yordam ber: ${f.q.trim()}`) : undefined);
    case "ai-cat": return openAI(route.cat ? L(`Помоги выбрать в разделе «${CAT[route.cat].ru}»: что лучше и на что смотреть?`, `«${CAT[route.cat].uz}» bo‘limida tanlashga yordam ber: qaysi biri yaxshi?`) : undefined, { send: !!route.cat });
    case "compare": return openDrawer("compare");
    case "cmp-clear": compare = []; LS.set("imorat.cmp", compare); renderCmpBar(); return drawerView === "compare" ? closeDrawer() : undefined;
    case "ai-cmp": return openAI(L(`Сравни ${compare.map(id => `[[${id}]]`).join(", ")}: что лучше выбрать и для каких задач подходит каждый?`, `${compare.map(id => `[[${id}]]`).join(", ")} ni solishtir: qaysi birini tanlash yaxshi va har biri qaysi vazifaga mos?`));
    case "ai-cart": return openAI(L("Проверь мою корзину: всё ли нужное есть для работы, хватит ли количества, что можно заменить дешевле?", "Savatimni tekshir: ish uchun hammasi bormi, miqdor yetadimi, nimani arzonroqqa almashtirish mumkin?"));
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { if ($("#authM").classList.contains("on")) closeAuth(); else if ($("#modal").classList.contains("on")) closeModal(); else if ($("#mega").classList.contains("on")) closeMega(); else if (aiOpen) closeAI(); else if (widOpen) closeWidgets(); else if (drawerView) closeDrawer(); } });
let trackSig = "";
setInterval(() => {
  if (drawerView !== "track" && drawerView !== "orders") { trackSig = ""; return; }
  const sig = drawerView + "|" + drawerOrder + "|" + orders.map(o => o.ships.map((sh, i) => stepOf(o, i, sh.tariff ? 6 : 3)).join(",")).join(";");
  if (sig !== trackSig) { trackSig = sig; const bd = $("#dBody"), y = bd.scrollTop; renderDrawer(); bd.scrollTop = y; }
}, 1000);

document.addEventListener("error", e => { const im = e.target; if (im && im.tagName === "IMG" && im.classList.contains("photo") && im.dataset.pid && PROD[im.dataset.pid]) im.outerHTML = artSvg(PROD[im.dataset.pid]); }, true);
route = parseHash();
renderAll();
renderCmpBar();
apiBoot();
if (location.hash === "#orders") setTimeout(() => openDrawer("orders"), 300);
["#drawer", "#ai", "#modal", "#mega", "#authM", "#wid"].forEach(s => $(s).setAttribute("inert", ""));
mqFine.addEventListener?.("change", () => { applyLook(); if (route.view === "home") renderMain(); });
})();
</script>
</body>
</html>
