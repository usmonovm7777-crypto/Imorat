<!doctype html>
<html lang="ru">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>

</head>
<body>
<style>
/* Layout: sticky two-row header → routed views: home (immersive hero with AI ask bar + product collage, trust strip, categories, bundles, rails, delivery estimator, calculators, VIP, stores), catalog (filters + grid), seller cabinet. Drawer for cart/checkout/tracking/profile, sheet modal for product, side panel for Usta AI chat. Mobile: bottom tab bar + floating AI button. */
:root {
  --bg: #F3F5F2;
  --surface: #FFFFFF;
  --raised: #F8FAF7;
  --ink: #131B1A;
  --muted: #5A6561;
  --faint: #8A9490;
  --line: #E0E5DF;
  --line-strong: #CBD2CB;
  --accent: #0B6E69;
  --accent-ink: #FFFFFF;
  --accent-soft: #E0EFEC;
  --signal: #D9530A;
  --signal-soft: #FCE8DB;
  --ok: #23803A;
  --warn: #B7791F;
  --vip-bg: #131B1A;
  --vip-fg: #F3F5F2;
  --hero-bg: #0F2321;
  --hero-fg: #EEF5F3;
  --hero-acc: #5ED3C6;
  --hero-line: rgba(238, 245, 243, .14);
  --tile-s: 32%;
  --tile-l: 92%;
  --tile-ink-s: 40%;
  --tile-ink-l: 30%;
  --art-fg: 34%;
  --art-d1: 22%;
  --art-d2: 14%;
  --art-hl: rgba(255, 255, 255, .7);
  --art-sh: .2;
  --shadow-sm: 0 1px 2px rgba(19, 27, 26, .06), 0 4px 14px rgba(19, 27, 26, .05);
  --shadow: 0 24px 60px rgba(14, 26, 24, .22);
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r-sm: 8px;
  --r: 16px;
  --r-lg: 26px;
  --nav-h: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1312; --surface: #171E1D; --raised: #1C2423; --ink: #E9EEEC; --muted: #9CA7A3; --faint: #74807C;
    --line: #28312F; --line-strong: #36403D; --accent: #3DB3AA; --accent-ink: #06201E; --accent-soft: #163029;
    --signal: #FF8040; --signal-soft: #3A2518; --ok: #6CC27A; --warn: #E0A84A; --vip-bg: #E9EEEC; --vip-fg: #121817;
    --hero-bg: #12302C; --hero-fg: #EEF5F3; --hero-acc: #6FE0D3; --hero-line: rgba(238, 245, 243, .14);
    --tile-s: 16%; --tile-l: 20%; --tile-ink-s: 48%; --tile-ink-l: 72%;
    --art-fg: 70%; --art-d1: 46%; --art-d2: 10%; --art-hl: rgba(255, 255, 255, .35); --art-sh: .45;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3); --shadow: 0 24px 60px rgba(0,0,0,.55); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1312; --surface: #171E1D; --raised: #1C2423; --ink: #E9EEEC; --muted: #9CA7A3; --faint: #74807C;
  --line: #28312F; --line-strong: #36403D; --accent: #3DB3AA; --accent-ink: #06201E; --accent-soft: #163029;
  --signal: #FF8040; --signal-soft: #3A2518; --ok: #6CC27A; --warn: #E0A84A; --vip-bg: #E9EEEC; --vip-fg: #121817;
  --hero-bg: #12302C; --hero-fg: #EEF5F3; --hero-acc: #6FE0D3; --hero-line: rgba(238, 245, 243, .14);
  --tile-s: 16%; --tile-l: 20%; --tile-ink-s: 48%; --tile-ink-l: 72%;
  --art-fg: 70%; --art-d1: 46%; --art-d2: 10%; --art-hl: rgba(255, 255, 255, .35); --art-sh: .45;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3); --shadow: 0 24px 60px rgba(0,0,0,.55); color-scheme: dark;
}
* { box-sizing: border-box; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; padding-bottom: var(--nav-h); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 31; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-size: .85em; font-variant-numeric: tabular-nums; }
.ic { background: hsl(var(--h, 170) var(--tile-s) var(--tile-l)); color: hsl(var(--h, 170) var(--tile-ink-s) var(--tile-ink-l)); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Product studio render ---------- */
.studio { background:
  radial-gradient(ellipse 70% 55% at 50% 38%, hsl(var(--h) var(--tile-s) calc(var(--tile-l) + 5%)) 0%, transparent 70%),
  linear-gradient(180deg, hsl(var(--h) var(--tile-s) var(--tile-l)) 0 70%, hsl(var(--h) var(--tile-s) calc(var(--tile-l) - 4%)) 70% 100%); }
.art { width: 100%; height: 100%; display: block; }
.art .sh { fill: hsl(var(--h) 30% 12%); opacity: var(--art-sh); filter: blur(2.2px); }
.art .d2 { stroke: hsl(var(--h) 35% var(--art-d2)); opacity: .28; }
.art .d1 { stroke: hsl(var(--h) 42% var(--art-d1)); }
.art .fg { stroke: hsl(var(--h) 48% var(--art-fg)); }
.art .hl { stroke: var(--art-hl); }
.photo { width: 100%; height: 100%; object-fit: cover; display: block; }

/* ---------- Header ---------- */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); }
.hdr-row { display: flex; align-items: center; gap: 12px; padding-block: 12px; }
.logo { display: flex; align-items: center; gap: 9px; flex: none; }
.logo-mark { width: 30px; height: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 2.5px; }
.logo-mark i { background: var(--accent); border-radius: 3px; }
.logo-mark i:nth-child(2) { background: var(--signal); }
.logo-mark i:nth-child(3) { opacity: .55; }
.logo b { font-family: var(--f-display); font-weight: 700; font-size: 19px; letter-spacing: -.03em; }
.cat-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 10px 16px; font-weight: 600; flex: none; }
.cat-btn:hover { filter: brightness(1.08); }
.search { flex: 1; min-width: 0; position: relative; }
.search input { width: 100%; border: 1.5px solid var(--line-strong); background: var(--raised); border-radius: 12px; padding: 10px 112px 10px 42px; transition: border-color .15s; }
.search input:focus { border-color: var(--accent); outline: none; background: var(--surface); }
.search > svg { position: absolute; left: 14px; top: 50%; translate: 0 -50%; color: var(--faint); pointer-events: none; }
.search .ask { position: absolute; right: 5px; top: 50%; translate: 0 -50%; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 9px; font-size: 13px; font-weight: 600; background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--signal))); color: #fff; }
.where { display: inline-flex; align-items: center; gap: 6px; border-radius: 12px; padding: 6px 4px 6px 10px; color: var(--muted); font-size: 13px; flex: none; }
.where:hover { background: var(--raised); }
.where select { border: 0; background: transparent; font-size: 13px; font-weight: 500; color: var(--ink); padding: 4px 2px; max-width: 150px; cursor: pointer; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 10px; padding: 2px; flex: none; }
.seg button { padding: 5px 9px; border-radius: 7px; font-size: 12px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.hb { position: relative; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex: none; color: var(--ink); }
.hb:hover { background: var(--raised); }
.hb .dot, .cart-btn .dot { position: absolute; top: 4px; right: 3px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--signal); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 5px; }
.cart-btn { position: relative; display: inline-flex; align-items: center; gap: 8px; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 16px; font-weight: 600; flex: none; }
.cart-btn .dot { position: static; }
.rail-nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px; margin-top: -2px; }
.rail-nav::-webkit-scrollbar { display: none; }
.rail-nav button { flex: none; padding: 6px 12px; border-radius: 8px; font-size: 14px; color: var(--muted); white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.rail-nav button:hover { color: var(--ink); background: var(--raised); }
.rail-nav button.hl { color: var(--signal); font-weight: 600; }
.rail-nav button.ai-l { color: var(--accent); font-weight: 600; }
@media (max-width: 1080px) { .where { display: none; } }
@media (max-width: 760px) {
  :root { --nav-h: calc(64px + env(safe-area-inset-bottom, 0px)); }
  .hdr-row { flex-wrap: wrap; gap: 10px; padding-block: 10px; }
  .logo { margin-right: auto; }
  .search { order: 5; flex-basis: 100%; }
  .cat-btn, .hb, .cart-btn, .rail-nav { display: none; }
  .search .ask .t { display: none; }
  .search input { padding-right: 52px; }
}

/* ---------- Bottom nav (mobile) ---------- */
.tabbar { display: none; }
@media (max-width: 760px) {
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .tabbar button { display: grid; justify-items: center; gap: 2px; font-size: 11px; color: var(--muted); padding: 4px 0; position: relative; }
  .tabbar button[aria-current="true"] { color: var(--accent); font-weight: 600; }
  .tabbar .dot { position: absolute; top: 0; left: calc(50% + 6px); min-width: 17px; height: 17px; border-radius: 9px; background: var(--signal); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }
}

/* ---------- Mega menu ---------- */
.mega { position: fixed; inset: 0; z-index: 45; display: none; }
.mega.on { display: block; }
.mega .scrim { position: absolute; inset: 0; background: rgba(8, 14, 13, .45); }
.mega-panel { position: relative; background: var(--surface); max-height: calc(100% - 24px); overflow-y: auto; border-radius: 0 0 var(--r-lg) var(--r-lg); box-shadow: var(--shadow); padding-top: env(safe-area-inset-top, 0px); }
.mega-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px 6px; }
.mega-cols { columns: 4 240px; column-gap: 28px; padding-block: 12px 32px; }
.mega-cat { break-inside: avoid; margin-bottom: 22px; display: grid; gap: 4px; }
.mega-cat > button { display: flex; align-items: center; gap: 10px; font-weight: 600; text-align: left; padding: 2px 0; }
.mega-cat > button .ico { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.mega-cat > button .ico svg { width: 20px; height: 20px; }
.mega-cat > button:hover span:last-child { color: var(--accent); }
.mega-cat ul { list-style: none; margin: 0; padding: 0 0 0 44px; display: grid; gap: 2px; }
.mega-cat li button { color: var(--muted); font-size: 14px; text-align: left; padding: 2px 0; }
.mega-cat li button:hover { color: var(--accent); }

/* ---------- Common ---------- */
h1, h2, h3 { text-wrap: balance; }
.h-xl { font-family: var(--f-display); font-weight: 700; font-size: clamp(30px, 5vw, 60px); line-height: 1.02; letter-spacing: -.045em; margin: 0; }
.h-l { font-family: var(--f-display); font-weight: 600; font-size: clamp(22px, 2.8vw, 30px); letter-spacing: -.03em; margin: 0; line-height: 1.15; }
.h-m { font-family: var(--f-display); font-weight: 500; font-size: 18px; letter-spacing: -.02em; margin: 0; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.sec { padding-block: 26px; }
.sec-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.sec-head p { margin: 6px 0 0; color: var(--muted); }
.link { color: var(--accent); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; }
.link:hover { text-decoration: underline; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; padding: 12px 18px; font-weight: 600; transition: filter .15s, background .15s, border-color .15s; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-dark { background: var(--ink); color: var(--bg); }
.btn-line { border: 1.5px solid var(--line-strong); }
.btn-line:hover { border-color: var(--ink); }
.btn-ai { background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--signal))); color: #fff; }
.btn-ai:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.pill.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.pill.sig { background: var(--signal-soft); color: var(--signal); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.pill.mute { background: var(--raised); color: var(--muted); border: 1px solid var(--line); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 14px; white-space: nowrap; }
.chip:hover { border-color: var(--line-strong); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* ---------- Hero ---------- */
.hero { margin-top: 20px; background: var(--hero-bg); color: var(--hero-fg); border-radius: var(--r-lg); display: grid; grid-template-columns: 1.15fr 1fr; gap: 24px; padding: clamp(24px, 4.5vw, 56px); position: relative; overflow: hidden; isolation: isolate; }
.hero::before { content: ""; position: absolute; inset: 0; z-index: -1; background:
  radial-gradient(600px 300px at 85% 10%, color-mix(in srgb, var(--hero-acc) 22%, transparent), transparent 70%),
  radial-gradient(500px 260px at 10% 110%, color-mix(in srgb, var(--signal) 22%, transparent), transparent 70%),
  repeating-linear-gradient(0deg, transparent 0 39px, var(--hero-line) 39px 40px),
  repeating-linear-gradient(90deg, transparent 0 39px, var(--hero-line) 39px 40px);
  mask: linear-gradient(180deg, #000, rgba(0,0,0,.55)); -webkit-mask: linear-gradient(180deg, #000, rgba(0,0,0,.55)); }
.hero .eyebrow { color: color-mix(in srgb, var(--hero-fg) 70%, transparent); }
.hero .h-xl em { font-style: normal; color: var(--hero-acc); }
.hero-l { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-content: center; min-width: 0; }
.hero .eyebrow { flex-wrap: wrap; }
.hero .lead { color: color-mix(in srgb, var(--hero-fg) 76%, transparent); font-size: 17px; max-width: 50ch; margin: 0; }
.askbar { display: flex; align-items: center; gap: 8px; background: var(--hero-fg); color: #10201E; border-radius: 16px; padding: 6px 6px 6px 16px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.askbar svg.sp { color: var(--signal); flex: none; }
.askbar input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 10px 0; font-size: 15px; color: #10201E; outline: none; }
.askbar input::placeholder { color: #6A7774; }
.askbar .btn { padding: 11px 16px; }
.hero-q { display: flex; gap: 8px; flex-wrap: wrap; }
.hero-q button { border: 1px solid var(--hero-line); color: var(--hero-fg); border-radius: 999px; padding: 6px 12px; font-size: 13px; background: color-mix(in srgb, var(--hero-fg) 6%, transparent); }
.hero-q button:hover { background: color-mix(in srgb, var(--hero-fg) 14%, transparent); }
.stats { display: flex; gap: 28px; flex-wrap: wrap; }
.stats div { display: grid; }
.stats b { font-family: var(--f-display); font-size: 24px; font-weight: 600; letter-spacing: -.03em; }
.stats span { color: color-mix(in srgb, var(--hero-fg) 62%, transparent); font-size: 13px; }
.collage { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-content: center; transform: rotate(-4deg); }
.collage .tile { aspect-ratio: 1 / 1; max-width: 100%; border-radius: 18px; overflow: hidden; position: relative; box-shadow: 0 18px 40px rgba(0,0,0,.28); animation: float 7s ease-in-out infinite; text-align: left; }
.collage .tile:nth-child(2n) { animation-delay: -2.5s; transform: translateY(18px); }
.collage .tile:nth-child(3n) { animation-delay: -4.5s; }
.collage .tile span { position: absolute; left: 8px; right: 8px; bottom: 8px; background: color-mix(in srgb, var(--surface) 88%, transparent); color: var(--ink); border-radius: 9px; padding: 4px 8px; font-size: 11.5px; font-weight: 600; line-height: 1.25; backdrop-filter: blur(6px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@keyframes float { 50% { translate: 0 -8px; } }
@media (max-width: 920px) { .hero { grid-template-columns: minmax(0, 1fr); } .collage { transform: none; grid-template-columns: repeat(6, 1fr); gap: 8px; } .collage .tile { border-radius: 12px; } .collage .tile span { display: none; } .collage .tile:nth-child(2n) { transform: none; } }
@media (max-width: 520px) { .collage { grid-template-columns: repeat(3, 1fr); } .collage .tile:nth-child(n+4) { display: none; } .askbar .btn span { display: none; } }

.trust { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; }
.trust div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: center; }
.trust .ti { width: 36px; height: 36px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.trust b { font-size: 14px; display: block; line-height: 1.25; }
.trust small { color: var(--muted); font-size: 12.5px; }
@media (max-width: 960px) { .trust { grid-template-columns: 1fr 1fr; } }
@media (max-width: 440px) { .trust { grid-template-columns: 1fr; } }

/* ---------- Category tiles ---------- */
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.cat-tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; text-align: left; transition: border-color .15s, transform .15s, box-shadow .15s; align-content: start; }
.cat-tile:hover { border-color: var(--line-strong); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.cat-tile .ico { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; }
.cat-tile .ico svg { width: 28px; height: 28px; }
.cat-tile b { font-weight: 600; font-size: 14px; line-height: 1.25; }
.cat-tile small { color: var(--muted); font-size: 12px; }

/* ---------- Bundles ---------- */

.bundle b { font-weight: 600; font-size: 16px; }
.bundle ul { margin: 0; padding: 0; list-style: none; font-size: 13px; color: var(--muted); display: grid; gap: 2px; }
.bundle .bp { display: flex; align-items: baseline; gap: 8px; margin-top: auto; flex-wrap: wrap; }

@media (max-width: 1080px) { .bundles { grid-template-columns: 1fr 1fr; } }
@media (max-width: 520px) { .bundles { grid-template-columns: 1fr; } }

/* ---------- Product cards ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(200px, 230px); gap: 12px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; scrollbar-width: thin; }
.rail > * { scroll-snap-align: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); position: relative; display: flex; flex-direction: column; overflow: hidden; transition: box-shadow .2s, border-color .2s, transform .2s; }
.card:hover { box-shadow: var(--shadow-sm); border-color: var(--line-strong); transform: translateY(-2px); }
.thumb { display: block; aspect-ratio: 1 / 1; width: 100%; max-width: 100%; position: relative; overflow: hidden; }
.thumb .art { transition: transform .35s cubic-bezier(.2,.8,.2,1); }
.card:hover .thumb .art { transform: scale(1.06) translateY(-2px); }
.badges { position: absolute; left: 10px; top: 10px; display: flex; gap: 4px; flex-wrap: wrap; }
.badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--signal); color: #fff; letter-spacing: .02em; }
.badge.new { background: var(--accent); color: var(--accent-ink); }
.badge.svc { background: var(--ink); color: var(--bg); }
.fav { position: absolute; right: 8px; top: 8px; width: 36px; height: 36px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; color: var(--muted); box-shadow: var(--shadow-sm); }
.fav:hover, .fav.on { color: var(--signal); }
.fav.on svg { fill: currentColor; }
.cb { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.rate { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.rate .s { display: inline-flex; align-items: center; gap: 3px; color: var(--ink); font-weight: 600; }
.rate .s svg { color: #E8A200; fill: currentColor; }
.card h3 { font-size: 14.5px; font-weight: 500; margin: 0; line-height: 1.3; }
.card h3 button { text-align: left; }
.card h3 button:hover { color: var(--accent); }
.unitline { font-size: 12px; color: var(--faint); }
.buy { display: flex; align-items: end; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 10px; }
.buy .price { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.buy .sub { font-size: 12px; color: var(--muted); }
.buy .inst { font-size: 11.5px; color: var(--accent); font-weight: 600; }
.add { min-width: 42px; height: 42px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; flex: none; padding: 0 10px; }
.add:hover { filter: brightness(1.08); }
.add.in { background: var(--accent-soft); color: var(--accent); }
.empty { padding: 48px 20px; text-align: center; color: var(--muted); border: 1.5px dashed var(--line-strong); border-radius: var(--r); display: grid; gap: 12px; justify-items: center; }

/* ---------- Delivery band ---------- */
.deliv-band { display: grid; grid-template-columns: 1fr 1.1fr; gap: 12px; align-items: start; }
.how { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: clamp(20px, 3vw, 30px); display: grid; gap: 18px; align-content: start; }
.how ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; counter-reset: s; }
.how li { display: grid; grid-template-columns: 40px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); counter-increment: s; }
.how li::before { content: counter(s); width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 14px; }

.how li span { color: var(--muted); font-size: 14px; }
.est { background: var(--hero-bg); color: var(--hero-fg); border-radius: var(--r-lg); padding: clamp(20px, 3vw, 30px); display: grid; gap: 16px; align-content: start; }

@media (max-width: 920px) { .deliv-band { grid-template-columns: 1fr; } }

/* ---------- Calculators ---------- */
.calcs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

/* ---------- VIP ---------- */
.vip { background: var(--vip-bg); color: var(--vip-fg); border-radius: var(--r-lg); padding: clamp(22px, 4vw, 44px); display: grid; grid-template-columns: 1.1fr 1fr; gap: 32px; position: relative; overflow: hidden; }
.vip::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: linear-gradient(90deg, var(--signal), var(--accent)); }

.vip-price { display: flex; align-items: baseline; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
.vip-price b { font-family: var(--f-display); font-size: 30px; letter-spacing: -.03em; }
.vip-price span { color: color-mix(in srgb, var(--vip-fg) 60%, transparent); }
.vip .btn-primary { background: var(--signal); color: #fff; margin-top: 18px; }
.vip .btn-on { margin-top: 18px; border: 1.5px solid color-mix(in srgb, var(--vip-fg) 35%, transparent); }
.perks { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-content: center; }

@media (max-width: 860px) { .vip { grid-template-columns: 1fr; } }
@media (max-width: 440px) { .perks { grid-template-columns: 1fr; } }

/* ---------- Stores ---------- */
.stores { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.store { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; grid-template-columns: 46px 1fr; gap: 12px; align-items: start; }
.store .av { width: 46px; height: 46px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 16px; }
.store b { font-weight: 600; display: block; }

.store .r { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.seller-band { background: var(--accent); color: var(--accent-ink); border-radius: var(--r-lg); padding: clamp(22px, 4vw, 40px); display: grid; grid-template-columns: 1.4fr auto; gap: 24px; align-items: center; }

footer { padding-block: 36px 40px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); margin-top: 24px; }
.foot { display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 24px; }

/* ---------- Catalog view ---------- */
.crumbs { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); padding-block: 18px 6px; }

.cat-layout { display: grid; grid-template-columns: 260px 1fr; gap: 24px; align-items: start; padding-bottom: 32px; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 128px); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); max-height: calc(100vh - 150px); overflow-y: auto; }

@media (max-width: 860px) { .cat-layout { grid-template-columns: 1fr; gap: 12px; } .side { position: static; max-height: none; } }

/* ---------- Drawer, AI panel & modal ---------- */
.scrim-g { position: fixed; inset: 0; background: rgba(8, 14, 13, .5); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim-g.on { opacity: 1; pointer-events: auto; }
.drawer, .ai { position: fixed; top: 0; right: 0; bottom: 0; width: min(500px, 100%); background: var(--surface); z-index: 50; box-shadow: var(--shadow); transform: translateX(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); visibility: hidden; }

.ai { z-index: 52; width: min(460px, 100%); }
.d-head { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--line); }

.ib:hover { background: var(--raised); }

.gh { display: flex; justify-content: space-between; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); padding-bottom: 6px; border-bottom: 1px solid var(--line); }

.line { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.mini { width: 56px; height: 56px; border-radius: 12px; overflow: hidden; flex: none; display: block; }
.line .nm { font-size: 14px; min-width: 0; line-height: 1.3; }

.line .rt { display: grid; gap: 6px; justify-items: end; }
.svc-ico { width: 56px; height: 56px; border-radius: 12px; display: grid; place-items: center; background: var(--raised); border: 1px solid var(--line); color: var(--accent); }
.qty { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 999px; }
.qty button { width: 30px; height: 30px; display: grid; place-items: center; font-size: 16px; }

.sumrow { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }

.note { font-size: 12.5px; color: var(--muted); background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.note.vipn { background: var(--signal-soft); border-color: transparent; color: var(--ink); }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; min-width: 0; }
legend { font-family: var(--f-display); font-size: 15px; font-weight: 600; margin-bottom: 10px; padding: 0; letter-spacing: -.01em; }
.f { display: grid; gap: 4px; min-width: 0; }

.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: start; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; }
.opt:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); }

.opt b { font-weight: 600; }

.opt .tag { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.opt.vipopt b::after { content: "VIP"; font-size: 10px; font-weight: 700; background: var(--signal); color: #fff; padding: 1px 6px; border-radius: 4px; margin-left: 6px; vertical-align: 2px; }
.pay { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 8px; }

.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; cursor: pointer; }

.ship { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 4px; font-size: 14px; }

.courier { display: grid; grid-template-columns: 1fr auto; gap: 8px; font-size: 14px; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; align-items: center; }

.order-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; text-align: left; padding: 12px; border: 1px solid var(--line); border-radius: 12px; width: 100%; align-items: center; }

.vip-card { background: var(--vip-bg); color: var(--vip-fg); border-radius: var(--r); padding: 16px; display: grid; gap: 8px; }

.modal { position: fixed; inset: 0; z-index: 55; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); visibility: hidden; pointer-events: none; }

}

/* ---------- Photos, motion & extras ---------- */
.studio > img.photo { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb img.photo { transition: transform .45s cubic-bezier(.2,.8,.2,1); }
.card:hover .thumb img.photo { transform: scale(1.06); }
html.lock { overflow: hidden; }
.cat-tile { grid-template-rows: auto 1fr; padding: 12px; gap: 8px; overflow: hidden; }
.cat-tile .cat-img { display: block; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 10px; overflow: hidden; }
.cat-tile .cat-img img { transition: transform .4s cubic-bezier(.2,.8,.2,1); }
.cat-tile:hover .cat-img img { transform: scale(1.08) rotate(-1deg); }
.cat-tile.all { align-content: space-between; }
.cat-tile.all .ico { margin-top: auto; }
.marquee { overflow: hidden; margin-top: 12px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); padding-block: 10px; -webkit-mask: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); mask: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }
.mq-track { display: flex; gap: 10px; width: max-content; }

.route { width: 100%; height: auto; display: block; border-radius: 14px; background: var(--raised); border: 1px solid var(--line); }
.route .st { stroke: var(--line-strong); }

.route .river { stroke: color-mix(in srgb, #3a9bd8 45%, var(--raised)); }
.route .path { stroke: var(--accent); }
.route .pathbg { stroke: color-mix(in srgb, var(--accent) 22%, transparent); }
.route .pin { fill: var(--signal); }
.route .pin2 { fill: var(--accent); }
.route .lbl { fill: var(--ink); font: 600 12px var(--f-body); }
.route .lbl2 { fill: var(--muted); font: 500 11px var(--f-body); }
.route .chip { fill: var(--ink); }
.route .chipt { fill: var(--bg); font: 700 12px var(--f-body); }
.route .truck { fill: var(--accent); }
.route .truckw { fill: var(--accent-ink); }
.cmp-bar { position: fixed; left: max(18px, env(safe-area-inset-left, 0px)); bottom: calc(18px + var(--nav-h) + env(safe-area-inset-bottom, 0px)); z-index: 34; display: flex; align-items: center; gap: 10px; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 6px 8px 6px 6px; box-shadow: var(--shadow); }
.cmp-bar .mini { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--ink); margin-left: -12px; }
.cmp-bar .mini:first-child { margin-left: 0; }
.cmp-bar button.go { font-weight: 700; padding: 6px 10px; border-radius: 999px; background: var(--bg); color: var(--ink); font-size: 13px; }
.cmp-bar button.x { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--bg); }
.cmp-tbl { overflow-x: auto; margin-inline: -4px; }

.cmp-tbl th, .cmp-tbl td { vertical-align: top; font-size: 13.5px; padding: 8px; text-transform: none; letter-spacing: 0; }

.cmp-tbl .mini { width: 100%; height: auto; aspect-ratio: 1 / 1; border-radius: 10px; }
.cmp-tbl .best { color: var(--ok); font-weight: 700; }
.tier { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
.tier span { border: 1px solid var(--line); border-radius: 9px; padding: 6px 8px; font-size: 12.5px; display: grid; background: var(--surface); }
.tier span b { font-size: 13.5px; font-variant-numeric: tabular-nums; }

.ws { font-size: 12px; color: var(--ok); font-weight: 600; }
.flyer { position: fixed; z-index: 80; width: 64px; height: 64px; border-radius: 50%; overflow: hidden; pointer-events: none; box-shadow: var(--shadow); }
.flyer img, .flyer svg { width: 100%; height: 100%; object-fit: cover; }
@property --ang { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
/* Rich mode (glow, motion): html.fx — on by default on desktop, switchable by the user */

  html.fx .askbar { border: 2px solid transparent; background: linear-gradient(var(--hero-fg), var(--hero-fg)) padding-box, conic-gradient(from var(--ang), var(--hero-acc), var(--signal), #ffffff, var(--hero-acc)) border-box; animation: spin 5s linear infinite; }
  @keyframes spin { to { --ang: 360deg; } }
  html.fx .hero .h-xl { animation: rise 1s cubic-bezier(.2,.8,.2,1) both; }
  html.fx .hero .lead, html.fx .hero .askbar, html.fx .hero .hero-q, html.fx .hero .stats { animation: rise 1s cubic-bezier(.2,.8,.2,1) both; }
  html.fx .hero .lead { animation-delay: .08s; } html.fx .hero .askbar { animation: rise 1s cubic-bezier(.2,.8,.2,1) .16s both, spin 5s linear infinite; } html.fx .hero .hero-q { animation-delay: .22s; } html.fx .hero .stats { animation-delay: .28s; }
  @keyframes rise { from { transform: translateY(22px); filter: blur(3px); } to { transform: none; filter: none; } }
  html.fx .collage .tile { transform: translate3d(calc(var(--px, 0) * var(--d, 10) * 1px), calc(var(--py, 0) * var(--d, 10) * 1px + var(--oy, 0px)), 0); transition: transform .25s ease-out, box-shadow .25s; }
  html.fx .collage .tile:nth-child(1) { --d: 14; } html.fx .collage .tile:nth-child(2) { --d: 22; --oy: 18px; } html.fx .collage .tile:nth-child(3) { --d: 10; }
  html.fx .collage .tile:nth-child(4) { --d: 26; --oy: 18px; } html.fx .collage .tile:nth-child(5) { --d: 12; } html.fx .collage .tile:nth-child(6) { --d: 18; --oy: 18px; }
  html.fx .collage .tile:hover { box-shadow: 0 26px 60px rgba(0,0,0,.4); }
  html.fx .hero::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(420px 320px at var(--gx, 70%) var(--gy, 30%), color-mix(in srgb, var(--hero-acc) 18%, transparent), transparent 70%); transition: background .2s; }
  html.fx .mq-track { animation: marquee 48s linear infinite; }
  html.fx .marquee:hover .mq-track { animation-play-state: paused; }
  @keyframes marquee { to { transform: translateX(-50%); } }
  html.fx .card, html.fx .bundle, html.fx .cat-tile { transform-style: preserve-3d; will-change: transform; }
  html.fx .tilt { transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(-4px) !important; transition: transform .08s linear, box-shadow .2s !important; box-shadow: 0 22px 40px rgba(14, 26, 24, .16) !important; }
  html.fx .card::after, html.fx .bundle::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; opacity: 0; transition: opacity .25s; background: radial-gradient(260px 200px at var(--mx, 50%) var(--my, 30%), rgba(255,255,255,.22), transparent 70%); z-index: 2; }
  html.fx .tilt::after { opacity: 1; }
  html.fx .bundle { position: relative; }
  html.fx .sec-head .h-l { background: linear-gradient(currentColor, currentColor) 0 100% / 0 3px no-repeat; transition: background-size .6s; padding-bottom: 4px; }
  html.fx .sec-head:hover .h-l { background-size: 64px 3px; }
  html.fx .route .dash { stroke-dasharray: 6 8; animation: dash 1.2s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -28; } }
  @supports (animation-timeline: view()) {
    html.fx .rv { animation: rv linear both; animation-timeline: view(); animation-range: entry 0% cover 24%; }
    @keyframes rv { from { opacity: .2; transform: translateY(48px) scale(.985); } to { opacity: 1; transform: none; } }
    html.fx .rv-x > * { animation: rvx linear both; animation-timeline: view(); animation-range: entry 0% cover 30%; }
    @keyframes rvx { from { opacity: .2; transform: translateX(60px) rotate(1.5deg); } to { opacity: 1; transform: none; } }
  }
  html.fx::view-transition-old(root), html.fx::view-transition-new(root) { animation-duration: .35s; }

@media (max-width: 760px), (hover: none) {
  html:not(.fx) .marquee { overflow-x: auto; -webkit-mask: none; mask: none; scrollbar-width: none; }
  html:not(.fx) .marquee::-webkit-scrollbar { display: none; }
  html:not(.fx) .mq-track { padding-inline: 10px; }
  html:not(.fx) .collage .tile { animation: none; }
}
@media (max-width: 760px) {

}

/* ---------- Auth & variants ---------- */

.soc { display: flex; align-items: center; justify-content: center; gap: 10px; border: 1.5px solid var(--line-strong); border-radius: 12px; padding: 13px; font-weight: 600; background: var(--surface); width: 100%; }

.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.phone-in { display: flex; border: 1.5px solid var(--line); border-radius: 12px; background: var(--raised); overflow: hidden; }

const LOCAL = ["build", "metal", "fasten"];
function makeProduct(id, cat, sub, icon, ru, uz, unit, price, kg, stores, flags = "") {
  const offers = stores.split(",").map((s, i) => ({
    store: s,
    price: i === 0 ? price : round(price * (1 + (((id * 7 + i * 13) % 9) - 3) / 100)),
    stock: (id * 11 + i * 17 + 5) % 70
  }));
  return {
    id, cat, sub, icon, ru, uz, unit, kg, offers,
    hit: flags.includes("hit"), isNew: flags.includes("new"),
    key: (flags.match(/k=(\w+)/) || [])[1],
    rating: 4.2 + ((id * 37) % 8) / 10,
    reviews: 12 + ((id * 53) % 240),
    country: LOCAL.includes(cat) ? COUNTRIES[0] : COUNTRIES[(id * 3) % 5],
    warranty: ["tools", "plumb", "heat", "elec", "light", "doors", "kitchen", "furn", "security"].includes(cat) ? [12, 24, 36][id % 3] : 0
  };
}

function addBundle(bid) {

    const floors = Math.max(0, (parseInt(d.floor, 10) || 1) - 1);

    if (d.when === "slot") p *= 0.9;

    if (vip) { if (t.id === "courier" && g.sum >= VIP_FREE_FROM) p = 0; else if (t.id !== "courier") p *= 0.5; }
    const price = round(p) + (d.when === "vip" && !vip ? VIP_HOUR_FEE : 0);
    return { g, t, dist, price, full };
  });
  const goods = gs.reduce((a, g) => a + g.sum, 0), del = ships.reduce((a, s) => a + s.price, 0), svc = svcSum(), disc = bundleDisc();
  const pd = promoDisc(goods);

let user = LS.get("imorat.user", null);
let accounts = LS.get("imorat.accounts", {});
let auth = {}, authTimer = null;
const digitsOf = s => String(s || "").replace(/\D/g, "");
const fmtPhone = d => { d = d.slice(0, 9); return [d.slice(0, 2), d.slice(2, 5), d.slice(5, 7), d.slice(7, 9)].filter(Boolean).join(" "); };
const fullPhone = d => "+998 " + fmtPhone(d);
const initial = n => (String(n || "?").trim()[0] || "?").toUpperCase();
const viaName = v => ({ google: "Google", apple: "Apple", phone: L("номер телефона", "telefon raqami") }[v] || v);
function openAuth(then, step = "start") {
  if (widOpen) closeWidgets();
  const edit = step === "store" && then === "seller-edit";
  const ms = edit ? myStore || {} : {};
  auth = { step, then: then || null, via: null, phone: "", code: "", devCode: "", sentAt: 0, name: user?.name || "", email: "", hide: false, err: "", ticket: "",
    role: then === "store" ? "store" : "buyer", dist: user?.district || district, busy: false, pending: null, edit,
    loc: ms.la != null && ms.loc_src && ms.loc_src !== "district" ? { la: ms.la, lo: ms.lo, src: ms.loc_src } : null, mapOpen: false,
    st: edit ? { name: ms.name, descr: ms.descr, cats: ms.cats || [], phone: digitsOf(ms.phone).slice(-9), telegram: ms.telegram, hours: ms.hours, district: ms.d, addr: ms.addr, landmark: ms.landmark } : { phone: digitsOf(user?.phone).slice(-9) } };
  setPanel($("#authM"), true); renderAuth(); syncLock();
}
const openStoreReg = () => (user ? openAuth("store", "store") : openAuth("store"));
function closeAuth() { setPanel($("#authM"), false); clearInterval(authTimer); syncLock(); }
const loadScript = src => new Promise((res, rej) => { if (document.querySelector(`script[src="${src}"]`)) return res(); const s = document.createElement("script"); s.src = src; s.async = true; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
function authBusy() { document.querySelectorAll("#authBox button[type=submit]").forEach(b => { b.disabled = true; b.textContent = L("Подождите…", "Kuting…"); }); }
async function sendCode() {
  auth.err = "";
  if (!API) { auth.code = String(100000 + Math.floor(Math.random() * 900000)); auth.sentAt = Date.now(); auth.step = "code"; return renderAuth(); }
  if (auth.busy) return;
  auth.busy = true; authBusy();
  try { const r = await api("POST", "/api/auth/otp/send", { phone: "998" + auth.phone }); auth.devCode = r.dev_code || ""; auth.sentAt = Date.now(); auth.step = "code"; }
  catch (e) { auth.err = apiErr(e); if (auth.step === "code") toast(auth.err); }
  auth.busy = false; renderAuth();
}
async function startOAuth(prov) {
  auth.via = prov; auth.err = "";
  if (!API) { auth.step = "oauth"; return renderAuth(); }
  const id = prov === "google" ? apiCfg?.google_client_id : apiCfg?.apple_client_id;
  if (!id) { auth.err = apiErr({ code: "provider_not_configured" }); return renderAuth(); }
  try {
    if (prov === "google") {
      auth.step = "google"; renderAuth();
      await loadScript("https://accounts.google.com/gsi/client");
      google.accounts.id.initialize({ client_id: id, callback: r => socialDone("google", { credential: r.credential }) });
      google.accounts.id.renderButton($("#gBtn"), { theme: "outline", size: "large", width: 300, text: "continue_with", locale: lang === "uz" ? "uz" : "ru" });
    } else {
      await loadScript("https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js");
      AppleID.auth.init({ clientId: id, scope: "name email", redirectURI: apiCfg.apple_redirect_uri || location.origin + location.pathname, usePopup: true });
      const r = await AppleID.auth.signIn();
      const nm = r.user?.name ? [r.user.name.firstName, r.user.name.lastName].filter(Boolean).join(" ") : "";
      await socialDone("apple", { id_token: r.authorization.id_token, name: nm });
    }
  } catch (e) {
    if (e && (e.error === "popup_closed_by_user" || e.error === "user_cancelled_authorize")) return;
    auth.step = "start"; auth.err = L("Не удалось открыть окно входа. Попробуйте ещё раз или войдите по номеру телефона.", "Kirish oynasini ochib bo‘lmadi. Qayta urinib ko‘ring yoki telefon raqami orqali kiring."); renderAuth();
  }
}
async function socialDone(prov, body) {
  try {
    const r = await api("POST", "/api/auth/" + prov, body);
    if (r.need_phone) { auth.ticket = r.ticket; auth.name = r.name || auth.name; auth.email = r.email || ""; auth.step = "phone"; auth.err = ""; return renderAuth(); }
    afterLogin(r);
  } catch (e) { auth.step = "start"; auth.err = apiErr(e); renderAuth(); }
}

/* ---- Store location: GPS or a point on the map of Tashkent (OpenStreetMap tiles, zoom 12) ---- */
const MAPZ = { x0: 2834, y0: 1529, n: 4, w: 4096 };
const mercX = lo => (lo + 180) / 360 * MAPZ.w;
const mercY = la => { const r = la * Math.PI / 180; return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * MAPZ.w; };
const toFrac = (la, lo) => ({ fx: (mercX(lo) - MAPZ.x0) / MAPZ.n, fy: (mercY(la) - MAPZ.y0) / MAPZ.n });
const fromFrac = (fx, fy) => { const tx = MAPZ.x0 + fx * MAPZ.n, ty = MAPZ.y0 + fy * MAPZ.n; return { lo: tx / MAPZ.w * 360 - 180, la: Math.atan(Math.sinh(Math.PI * (1 - 2 * ty / MAPZ.w))) * 180 / Math.PI }; };
const nearestDistrict = (la, lo) => DISTRICTS.reduce((b, d) => ((d.la - la) ** 2 + (d.lo - lo) ** 2 < (b.la - la) ** 2 + (b.lo - lo) ** 2 ? d : b)).id;
const inUz = (la, lo) => la > 37 && la < 46 && lo > 55 && lo < 74;
const yaLink = (la, lo) => `https://yandex.uz/maps/?pt=${lo.toFixed(6)},${la.toFixed(6)}&z=17&l=map`;
const PIN = `<svg class="pin" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z" fill="currentColor" stroke="#fff" stroke-width="1.5"/><circle cx="12" cy="10" r="2.6" fill="#fff"/></svg>`;
function pickMapHTML() {
  let tiles = "";
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) tiles += `<img src="https://tile.openstreetmap.org/12/${MAPZ.x0 + c}/${MAPZ.y0 + r}.png" alt="" draggable="false" decoding="async">`;
  const pts = DISTRICTS.map(d => ({ d, ...toFrac(d.la, d.lo) }));
  const cx = pts.reduce((a, p) => a + p.fx, 0) / pts.length, cy = pts.reduce((a, p) => a + p.fy, 0) / pts.length;
  const rx = Math.max(...pts.map(p => Math.abs(p.fx - cx))) * 1.3 + .03, ry = Math.max(...pts.map(p => Math.abs(p.fy - cy))) * 1.3 + .03;
  const scheme = `<svg class="scheme" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="var(--raised)"/>
    <ellipse cx="${(cx * 100).toFixed(1)}" cy="${(cy * 100).toFixed(1)}" rx="${(rx * 100).toFixed(1)}" ry="${(ry * 100).toFixed(1)}" fill="color-mix(in srgb,var(--accent) 9%,transparent)" stroke="var(--line-strong)" stroke-width=".5" stroke-dasharray="1.5 1"/>
    ${pts.map(p => `<circle cx="${(p.fx * 100).toFixed(1)}" cy="${(p.fy * 100).toFixed(1)}" r="1" fill="var(--muted)"/><text x="${(p.fx * 100).toFixed(1)}" y="${(p.fy * 100 - 2).toFixed(1)}" text-anchor="middle" font-size="3.2" fill="var(--muted)">${esc(L(p.d.ru, p.d.uz).replace(/ский$|ский район$/, ""))}</text>`).join("")}</svg>`;
  return `<div class="pickmap" id="pickMap" tabindex="0" role="application" aria-label="${L("Карта Ташкента. Нажмите на место магазина или двигайте точку стрелками.", "Toshkent xaritasi. Do‘kon joyini bosing yoki nuqtani strelkalar bilan suring.")}">
    <div class="tiles">${tiles}</div>${scheme}<span id="mapPin" hidden>${PIN}</span><span class="attr">© OpenStreetMap</span></div>
    <small class="loc-st">${L("Нажмите на карту там, где находится магазин. Приблизить точнее можно в Яндекс Картах по ссылке выше.", "Do‘kon joylashgan joyni xaritada bosing. Aniqroq ko‘rish uchun yuqoridagi Yandex Xaritalar havolasidan foydalaning.")}</small>`;
}
function locStatus() {

function setLoc(la, lo, src, acc) {

  const d = nearestDistrict(la, lo), sel = $("#sDist"); if (sel) sel.value = d;
  $("#locSt").outerHTML = locStatus();

function placePin() {
  const pin = $("#mapPin"); if (!pin || !auth.loc) return;
  const { fx, fy } = toFrac(auth.loc.la, auth.loc.lo);
  pin.hidden = !(fx >= 0 && fx <= 1 && fy >= 0 && fy <= 1);

function bindPickMap() {
  const pm = $("#pickMap"); if (!pm) return;
  pm.querySelectorAll(".tiles img").forEach(i => i.addEventListener("error", () => pm.classList.add("notiles"), { once: true }));
  pm.addEventListener("click", e => { const r = pm.getBoundingClientRect(); const p = fromFrac((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height); setLoc(p.la, p.lo, "map"); });
  pm.addEventListener("keydown", e => {
    const k = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key]; if (!k) return;
    e.preventDefault();
    const cur = auth.loc ? toFrac(auth.loc.la, auth.loc.lo) : toFrac(DIST[$("#sDist").value].la, DIST[$("#sDist").value].lo);
    const p = fromFrac(Math.min(1, Math.max(0, cur.fx + k[0] * .006)), Math.min(1, Math.max(0, cur.fy + k[1] * .006)));
    setLoc(p.la, p.lo, "map");

}
function gpsLocate() {
  const st = $("#locSt");
  if (!navigator.geolocation) { st.className = "loc-st bad"; st.textContent = L("Браузер не умеет определять местоположение — укажите точку на карте.", "Brauzer joylashuvni aniqlay olmaydi — xaritada nuqtani belgilang."); return; }
  st.className = "loc-st"; st.textContent = L("Определяем местоположение… Если браузер спросит разрешение, нажмите «Разрешить».", "Joylashuv aniqlanmoqda… Brauzer ruxsat so‘rasa, «Ruxsat berish»ni bosing.");
  navigator.geolocation.getCurrentPosition(pos => {
    const la = pos.coords.latitude, lo = pos.coords.longitude;
    if (!inUz(la, lo)) {
      const s = $("#locSt"); s.className = "loc-st bad";
      s.textContent = L(`Похоже, вы сейчас не в Узбекистане (${la.toFixed(2)}, ${lo.toFixed(2)}). Укажите точку магазина на карте вручную.`, `Hozir O‘zbekistonda emassiz shekilli (${la.toFixed(2)}, ${lo.toFixed(2)}). Do‘kon nuqtasini xaritada qo‘lda belgilang.`);
      if (!auth.mapOpen) toggleMap(true);

    setLoc(la, lo, "gps", Math.round(pos.coords.accuracy));
  }, err => {
    const s = $("#locSt"); if (!s) return; s.className = "loc-st bad";
    s.textContent = err.code === 1 ? L("Доступ к местоположению запрещён. Разрешите его в настройках браузера или укажите точку на карте.", "Joylashuvga ruxsat berilmagan. Brauzer sozlamalarida ruxsat bering yoki xaritada nuqtani belgilang.")
      : L("Не удалось определить местоположение. Попробуйте ещё раз на улице или укажите точку на карте.", "Joylashuvni aniqlab bo‘lmadi. Ochiq joyda qayta urinib ko‘ring yoki xaritada belgilang.");
  }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
}

function bindStoreForm() {

function mdLite(src) {

  s = s.replace(/\[\[\d*(?::\d*)?$/, "").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  const lines = s.split(/\n/), out = []; let list = null;
  for (const raw of lines) {
    const ln = raw.trim();
    const m = ln.match(/^(?:[-•*]|\d+[.)])\s+(.*)$/);
    if (m) { if (!list) { list = []; } list.push(`<li>${m[1]}</li>`); continue; }
    if (list) { out.push(`<ul>${list.join("")}</ul>`); list = null; }
    if (ln) out.push(`<p>${ln}</p>`);
  }
  if (list) out.push(`<ul>${list.join("")}</ul>`);
  return { html: out.join(""), refs };
}

function offlineReply(q) {

  const b = BUNDLES.find(x => words.some(w => (x.ru + " " + x.sru).toLowerCase().includes(w)));
  let picks = PRODUCTS.map(p => [p, score(p)]).filter(x => x[1] >= 1).sort((a, c) => c[1] - a[1]).slice(0, 5).map(x => x[0]);
  if (b) picks = bundleItems(b).map(([p, n]) => ({ p, n }));

  const head = L("Сейчас я работаю в офлайн-режиме, поэтому подобрал товары по ключевым словам. Полные советы и расчёты появятся, когда страница открыта в Claude.", "Hozir oflayn rejimdaman, mahsulotlarni kalit so‘zlar bo‘yicha tanladim. To‘liq maslahat va hisoblar sahifa Claude’da ochilganda ishlaydi.");

  return head + "\n\n" + (b ? L(`Похоже на комплект «${b.ru}»:`, `«${b.uz}» to‘plamiga o‘xshaydi:`) + "\n" : "") + picks.map(x => `- [[${x.p.id}:${x.n}]]`).join("\n");
}

  const seen = new Set();
  apiCat.products.forEach(x => {
    seen.add(x.id);
    const p = PROD[x.id];
    if (p) { p.offers = x.offers; if (x.img && x.img.startsWith("/uploads/")) p.img = abs(x.img); if (x.desc) p.descRu = x.desc; }
    else PRODUCTS.push({ ...x, img: abs(x.img), descRu: x.desc || "", group: x.group || undefined, key: x.key || undefined, mine: false });

const hhmm = ms => new Date(ms).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
const CANCEL_TXT = () => ({ not_accepted: L("магазин не подтвердил заказ вовремя", "do‘kon buyurtmani o‘z vaqtida tasdiqlamadi"), out_of_stock: L("товара не оказалось в наличии", "mahsulot mavjud emas ekan"), not_shipped: L("магазин не передал заказ вовремя", "do‘kon buyurtmani o‘z vaqtida topshirmadi"), buyer: L("вы отменили заказ", "buyurtmani bekor qildingiz"), admin: L("отменено поддержкой Imorat", "Imorat yordam xizmati bekor qildi") });
/* Store hours are Tashkent time (UTC+5) */
function openState(s) {
  const m = String(s.hours || "").match(/(\d{1,2}):(\d{2})\D+(\d{1,2}):(\d{2})/);
  if (!m) return { open: true, text: s.hours || "" };
  const o = +m[1] * 60 + +m[2], c = +m[3] * 60 + +m[4];
  const t = new Date(Date.now() + 5 * 3600000), mins = t.getUTCHours() * 60 + t.getUTCMinutes();
  if (c <= o || (mins >= o && mins < c)) return { open: true, text: c <= o ? L("Круглосуточно", "Kecha-kunduz") : L(`Открыто до ${m[3].padStart(2, "0")}:${m[4]}`, `${m[3].padStart(2, "0")}:${m[4]} gacha ochiq`) };
  return { open: false, text: L(`Закрыто · откроется в ${m[1].padStart(2, "0")}:${m[2]}`, `Yopiq · ${m[1].padStart(2, "0")}:${m[2]} da ochiladi`) };
}
/* Reliability shown to buyers. In the demo (no server) stores get stable sample numbers. */

/* ---------- Isometric renderer (SVG) ---------- */
function dsShade(hex, k) { const n = parseInt(hex.slice(1), 16); const f = c => Math.max(0, Math.min(255, Math.round(c * k))); return `rgb(${f(n >> 16 & 255)},${f(n >> 8 & 255)},${f(n & 255)})`; }

    if (fl.kind === "plank") for (let z = 0, k = 0; z < Lr; z += .2, k++) for (let x = (k % 3) * .4 + .3; x < W; x += 1.2) ln += `M${P(x, 0, z).join(",")}L${P(x, 0, Math.min(Lr, z + .2)).join(",")}`;
    g += `<path d="${ln}" stroke="${dsShade(fl.c, .82)}" stroke-width=".012" fill="none"/>`; }
  g += `<polygon points="${pts([[0, 0, 0], [0, 0, Lr], [0, H, Lr], [0, H, 0]])}" fill="${dsShade(wallC, .9)}"/>`;
  g += `<polygon points="${pts([[0, 0, 0], [W, 0, 0], [W, H, 0], [0, H, 0]])}" fill="${dsShade(wallC, .99)}"/>`;
  g += `<polygon points="${pts([[0, 0, 0], [0, 0, Lr], [0, .08, Lr], [0, .08, 0]])}" fill="${dsShade("#f2f0ea", .88)}"/><polygon points="${pts([[0, 0, 0], [W, 0, 0], [W, .08, 0], [0, .08, 0]])}" fill="#f2f0ea"/>`;
  for (const [a, b] of wins) g += `<polygon points="${pts([[0, .85, a], [0, .85, b], [0, 2.2, b], [0, 2.2, a]])}" fill="#f4f6f5"/><polygon points="${pts([[0, .9, a + .05], [0, .9, b - .05], [0, 2.15, b - .05], [0, 2.15, a + .05]])}" fill="url(#dsSky)"/><path d="M${P(0, .9, (a + b) / 2).join(",")}L${P(0, 2.15, (a + b) / 2).join(",")}" stroke="#f4f6f5" stroke-width=".04"/>`;

  return `<svg class="ds-svg" viewBox="${vb}" role="img" aria-label="${L("3D-план комнаты", "Xonaning 3D rejasi")} ${W}×${Lr} ${L("м", "m")}"><defs><linearGradient id="dsSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe0f2"/><stop offset="1" stop-color="#eaf6fb"/></linearGradient></defs>${g}</svg>`;
}

/* ---------- Estimate ---------- */
function dsEstimate(d) {
  const W = d.W, Lr = d.L, H = d.H, area = W * Lr, per = 2 * (W + Lr), wins = Math.max(0, d.win | 0), doors = Math.max(0, d.doors | 0);

  const add = (p, q, why) => { if (p && q > 0) lines.push({ p, q, why }); };
  if (d.q.walls === "paint" && d.wall) { const p = PROD[d.wall], vol = /10 л/.test(p.ru) ? 10 : 2.5, lit = wallA * .12 * 2; add(p, Math.ceil(lit / vol), L(`${fmtN(wallA)} м² × 2 слоя = ${lit.toFixed(1).replace(".", ",")} л`, `${fmtN(wallA)} m² × 2 qavat = ${lit.toFixed(1).replace(".", ",")} l`)); add(findName(/Грунтовка глубокого проникновения, 5 л/) || byKey("primer"), Math.ceil(wallA * .1 / 5), L("грунт перед покраской", "bo‘yashdan oldin gruntovka")); add(byKey("roller"), 1, ""); }
  if (d.q.walls === "wp") { const p = PROD[d.wp] || findName(/Обои флизелиновые «Цветы»/) || byKey("wp"); const strips = Math.ceil(per / 1.06), per1 = Math.max(1, Math.floor(10.05 / (H + .1))); add(p, Math.ceil(strips / per1), `${strips} ${L("полос", "bo‘lak")}`); }
  if (d.floor) { const p = PROD[d.floor], tile = p.cat === "tile"; add(p, Math.ceil(area * (tile ? 1.1 : 1.07)), `${area.toFixed(1).replace(".", ",")} ${L("м²", "m²")} + ${tile ? 10 : 7}%`); if (tile) add(byKey("glue"), Math.ceil(area * 5 / 25), L("плиточный клей 5 кг/м²", "kafel yelimi 5 kg/m²")); }
  const furn = {}; for (const it of d.items) if (it.ok !== false && PROD[it.pid]) { const q = it.krow ? it.n || 4 : 1; furn[it.pid] = (furn[it.pid] || 0) + q; }
  if (d.items.some(it => it.krow && it.ok !== false)) { add(findName(/Столешница 3 м, бетон/), Math.ceil(((d.items.find(i => i.krow).n || 4) * .6) / 3), ""); add(findName(/Мойка гранитная 60×50, чёрная/), 1, ""); add(findName(/Вытяжка наклонная 60 см, белая/), 1, ""); }
  const mats = [...lines];
  const furnL = Object.entries(furn).map(([id, q]) => ({ p: PROD[id], q }));
  const sum = a => a.reduce((s, l) => s + minPrice(l.p) * l.q, 0);
  return { mats, furn: furnL, wallA, area, total: sum(mats) + sum(furnL), matSum: sum(mats), furnSum: sum(furnL) };
}

    else if (API && apiCfg?.ai) { const r = await api("POST", "/api/ai/chat", { messages: [{ role: "user", content: prompt }], image: imageUrl || undefined, mode: "json", lang }, { raw: true }); text = await r.text(); }

  } catch (e) { return null; }
}

function resizeImg(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const s = Math.min(1, 560 / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", .8)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("bad image")); };
    img.src = url;
  });
}
